<body>
<main>
  <p class="eyebrow">Worktrace 用户使用说明书 · 图 5</p>
  <h1>异常退出后的恢复：四类判定，三个不同动作</h1>
  <p class="sub">强杀或崩溃之后，程序在启动时把上一次留下的事实判成四类；需要你处理的只有「待确认」那一类。</p>
  <figure>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840" role="img"
         aria-labelledby="fig-05-crash-recovery-title fig-05-crash-recovery-desc"
         font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
      <title id="fig-05-crash-recovery-title">异常退出后的启动判定与恢复页的三个动作</title>
      <desc id="fig-05-crash-recovery-desc">计时中被强杀或崩溃之后重新启动，启动扫描把上一次留下的事实判成四类：记录损坏（只诊断、隔离，不自动修复事实）；运行中且带开放区间（此前已闭合的可信前缀保留，剩下终点不可信的一段挂成待确认）；已经是待确认状态（原样保持，不增加已知工时）；已暂停且没有待确认段（保持已暂停，不自动继续计时）。待确认的那些会话出现在恢复页，页面给出待确认区间、待确认会话与记录损坏三个计数。你可以用三个互不合并的动作之一处理：确认这些起止把候选端点定成事实；丢弃不确定区间只作废待确认那一段、此前已闭合的可信工时保留；作废整次记录把这条会话全部区间软作废。计时不可用时还可以点重试恢复，它回到启动扫描；页面不会自动重试，也不会自动接受时钟校正。</desc>
      <defs>
        <marker id="fig-05-crash-recovery-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
        </marker>
      </defs>

      <rect x="0" y="0" width="1000" height="840" fill="#FBF9F6"/>

      <!-- 箭头先画 -->
      <path d="M500,94 V156" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M140,232 V280" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M380,232 V280" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M620,232 V280" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M860,232 V280" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M420,384 V406 Q420,414 428,414 H452 Q460,414 460,422 V440" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M560,384 V420 Q560,428 552,428 H528 Q520,428 520,436 V440" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M360,540 V568 Q360,576 352,576 H216 Q208,576 208,584 V600" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M500,540 V600" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M640,540 V568 Q640,576 648,576 H784 Q792,576 792,584 V600" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-05-crash-recovery-arrow)"/>
      <path d="M650,490 H972 Q980,490 980,482 V194 Q980,186 972,186 H728" fill="none" stroke="#6F6357" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fig-05-crash-recovery-arrow)"/>

      <!-- 箭头标签 -->
      <rect x="814" y="160" width="72" height="20" rx="2" fill="#FBF9F6"/>
      <text x="850" y="175" font-size="12" fill="#6F6357" text-anchor="middle">重试恢复</text>
      <rect x="256" y="550" width="48" height="20" rx="2" fill="#FBF9F6"/>
      <text x="280" y="565" font-size="12" fill="#6F6357" text-anchor="middle">定成事实</text>
      <rect x="444" y="546" width="48" height="20" rx="2" fill="#FBF9F6"/>
      <text x="468" y="561" font-size="12" fill="#6F6357" text-anchor="middle">部分作废</text>
      <rect x="696" y="550" width="48" height="20" rx="2" fill="#FBF9F6"/>
      <text x="720" y="565" font-size="12" fill="#6F6357" text-anchor="middle">整次作废</text>

      <!-- 起点 -->
      <circle cx="500" cy="88" r="6" fill="#2A2320"/>
      <text x="500" y="70" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">计时中被强杀 / 崩溃之后重新启动</text>

      <!-- 启动扫描 -->
      <rect x="280" y="156" width="440" height="76" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
      <text x="500" y="188" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">启动扫描</text>
      <text x="500" y="212" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">把上一次运行留下的事实判成四类（判定顺序不可颠倒）</text>

      <!-- 四类判定 -->
      <rect x="40" y="280" width="200" height="104" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
      <text x="140" y="310" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">记录损坏</text>
      <text x="140" y="338" font-size="12" fill="#6F6357" text-anchor="middle">只诊断、隔离</text>
      <text x="140" y="362" font-size="12" fill="#6F6357" text-anchor="middle">不自动修复事实</text>

      <rect x="280" y="280" width="200" height="104" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
      <text x="380" y="310" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">运行中 + 开放区间</text>
      <text x="380" y="338" font-size="12" fill="#6F6357" text-anchor="middle">可信前缀闭合</text>
      <text x="380" y="362" font-size="12" fill="#6F6357" text-anchor="middle">余段挂待确认</text>

      <rect x="520" y="280" width="200" height="104" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
      <text x="620" y="310" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">已是「待确认」</text>
      <text x="620" y="338" font-size="12" fill="#6F6357" text-anchor="middle">原样保持</text>
      <text x="620" y="362" font-size="12" fill="#6F6357" text-anchor="middle">不增加已知工时</text>

      <rect x="760" y="280" width="200" height="104" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
      <text x="860" y="310" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">已暂停 + 无待确认</text>
      <text x="860" y="338" font-size="12" fill="#6F6357" text-anchor="middle">保持已暂停</text>
      <text x="860" y="362" font-size="12" fill="#6F6357" text-anchor="middle">不自动继续计时</text>

      <!-- 恢复页 -->
      <rect x="350" y="440" width="300" height="100" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="500" y="470" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">恢复页</text>
      <text x="500" y="496" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">待确认候选 + 可信范围说明</text>
      <text x="500" y="520" font-size="12" fill="#6F6357" text-anchor="middle">待确认区间 N 条 / 会话 N 个 / 损坏 N 个</text>

      <!-- 三个动作 -->
      <rect x="60" y="600" width="280" height="100" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="200" y="630" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">确认这些起止</text>
      <text x="200" y="658" font-size="12" fill="#6F6357" text-anchor="middle">候选端点定成事实</text>
      <text x="200" y="682" font-size="12" fill="#6F6357" text-anchor="middle">不作废任何东西</text>

      <rect x="360" y="600" width="280" height="100" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="500" y="630" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">丢弃不确定区间</text>
      <text x="500" y="658" font-size="12" fill="#6F6357" text-anchor="middle">只作废待确认那一段</text>
      <text x="500" y="682" font-size="12" fill="#6F6357" text-anchor="middle">已闭合的可信工时保留</text>

      <rect x="660" y="600" width="280" height="100" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="800" y="630" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">作废整次记录</text>
      <text x="800" y="658" font-size="12" fill="#6F6357" text-anchor="middle">全部区间软作废</text>
      <text x="800" y="682" font-size="12" fill="#6F6357" text-anchor="middle">记录与审计仍可查看</text>

      <!-- 注记：口径（本图焦点） -->
      <rect x="40" y="440" width="3" height="100" rx="1" fill="#D9603A"/>
      <text x="56" y="458" font-size="12" font-weight="600" fill="#D9603A">可信前缀保留</text>
      <text x="56" y="486" font-size="12" fill="#6F6357">已闭合的那一段照旧算数</text>
      <text x="56" y="512" font-size="12" fill="#6F6357">候选区间不并入已确认工时</text>

      <!-- 图例：底部横条 -->
      <line x1="28" y1="740" x2="972" y2="740" stroke="#2A2320" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="28" y="762" font-size="12" font-weight="600" fill="#6F6357">图例</text>
      <rect x="68" y="752" width="18" height="12" rx="2" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
      <text x="94" y="762" font-size="12" fill="#6F6357">启动扫描的四类判定</text>
      <rect x="290" y="752" width="18" height="12" rx="2" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="316" y="762" font-size="12" fill="#6F6357">恢复页与三个动作</text>
      <rect x="500" y="750" width="3" height="16" rx="1" fill="#D9603A"/>
      <text x="514" y="762" font-size="12" fill="#6F6357">口径注记（焦点）</text>
      <line x1="660" y1="758" x2="696" y2="758" stroke="#6F6357" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="704" y="762" font-size="12" fill="#6F6357">重试恢复</text>
      <text x="28" y="790" font-size="12" fill="#6F6357">三个动作互不合并：确认＝把候选端点定成事实；丢弃不确定区间＝只作废待确认那一段；作废整次＝这条会话全部区间软作废。</text>
      <text x="28" y="814" font-size="12" fill="#6F6357">挂起的会话不会被程序悄悄结束；「重试恢复」与「接受检测到的时钟校正」都要你点了才执行，页面不自动重试。</text>
    </svg>
    <figcaption>图 5 · 异常退出后的恢复。色相＝功能类别（青＝启动扫描的判定、蓝＝恢复页与动作、橙红＝口径焦点），明度＝作用程度。</figcaption>
  </figure>

</main>
</body>
