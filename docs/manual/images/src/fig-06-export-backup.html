  <h1>导出与备份 / 恢复：文件落在哪，恢复换的是什么</h1>
  <p class="sub">导出和备份只是往固定目录写文件；恢复是唯一会覆盖数据的动作——它换掉整个库，库身份随之改变。</p>
  <figure>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" role="img"
         aria-labelledby="fig-06-export-backup-title fig-06-export-backup-desc"
         font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
      <title id="fig-06-export-backup-title">导出、备份与恢复的数据流与库身份变化</title>
      <desc id="fig-06-export-backup-desc">在数据页点导出，程序按 JSON 范围明细或 Markdown 周回顾生成文件，落到应用数据目录下的 exports 子目录；点备份，程序把当前库复制一份到 backups 子目录，备份不改业务数据。两个动作都把绝对路径和字节数交回页面，页面显示可复制的路径，并能用「打开所在位置」在文件管理器里定位。恢复要用一份备份：填入绝对路径、二次确认之后才发命令，成功后换库、库身份变化，本窗口与第二个窗口的旧展示一律作废并按新库重读；恢复期间是维护态，写类命令会被拒绝，库身份一变就自动解禁。</desc>
      <defs>
        <marker id="fig-06-export-backup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0 8 3 0 6" fill="#6F6357"/>
        </marker>
      </defs>

      <rect x="0" y="0" width="1000" height="770" fill="#FBF9F6"/>

      <!-- 箭头先画 -->
      <path d="M248,136 H320" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-06-export-backup-arrow)"/>
      <path d="M248,256 H320" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-06-export-backup-arrow)"/>
      <path d="M640,136 H720" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-06-export-backup-arrow)"/>
      <path d="M640,256 H720" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-06-export-backup-arrow)"/>
      <path d="M840,96 V72 Q840,64 832,64 H152 Q144,64 144,72 V96" fill="none" stroke="#6F6357" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fig-06-export-backup-arrow)"/>
      <path d="M144,296 V342 Q144,350 152,350 H392 Q400,350 400,358 V400" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-06-export-backup-arrow)"/>
      <path d="M840,296 V312 Q840,320 832,320 H568 Q560,320 560,328 V400" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-06-export-backup-arrow)"/>
      <path d="M600,450 H720" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-06-export-backup-arrow)"/>
      <path d="M840,500 V560" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-06-export-backup-arrow)"/>

      <!-- 箭头标签 -->
      <rect x="260" y="110" width="48" height="20" rx="2" fill="#FBF9F6"/>
      <text x="284" y="125" font-size="12" fill="#6F6357" text-anchor="middle">导出</text>
      <rect x="260" y="230" width="48" height="20" rx="2" fill="#FBF9F6"/>
      <text x="284" y="245" font-size="12" fill="#6F6357" text-anchor="middle">备份</text>

      <rect x="406" y="36" width="168" height="20" rx="2" fill="#FBF9F6"/>
      <text x="490" y="51" font-size="12" fill="#6F6357" text-anchor="middle">回执：绝对路径 + 大小</text>
      <rect x="197" y="324" width="150" height="20" rx="2" fill="#FBF9F6"/>

      <rect x="56" y="176" width="176" height="28" rx="4" fill="#FFFFFF" stroke="#6B9BC7" stroke-width="1"/>
      <text x="144" y="195" font-size="12" font-weight="500" fill="#2A2320" text-anchor="middle">导出</text>

      <rect x="320" y="96" width="320" height="80" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>

      <text x="480" y="152" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">JSON 范围明细 / Markdown 周回顾</text>

      <rect x="320" y="216" width="320" height="80" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
      <text x="480" y="248" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">备份</text>
      <text x="480" y="272" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">当前库的一份副本（不改业务数据）</text>

      <!-- 产物目录 -->
      <rect x="720" y="96" width="240" height="200" rx="6" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
      <text x="840" y="124" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">产物目录</text>
      <text x="840" y="146" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" fill="#6F6357" text-anchor="middle">%APPDATA%\com.worktrace.desktop\</text>
      <text x="732" y="176" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" fill="#2A2320">exports\</text>
      <text x="732" y="198" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" fill="#6F6357">worktrace-export-json-时间戳.json</text>
      <text x="732" y="220" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" fill="#6F6357">worktrace-export-weekly-时间戳.md</text>
      <text x="732" y="250" font-size="10" font-family="'Geist Mono',ui-monospace,monospace" font-weight="500" fill="#2A2320">backups\</text>
      <text x="732" y="272" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" fill="#6F6357">worktrace-f1-s1-v0.1.0-时间戳.db</text>

      <!-- 恢复 -->
      <rect x="320" y="400" width="280" height="100" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
      <text x="460" y="432" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">恢复</text>
      <text x="460" y="458" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">二次确认之后才发命令</text>
      <text x="460" y="482" font-size="12" fill="#6F6357" text-anchor="middle">唯一会覆盖数据的动作</text>

      <!-- 换库：本图唯一“强”档焦点 -->
      <rect x="720" y="400" width="240" height="100" rx="6" fill="#F6E4BE" stroke="#CBA758" stroke-width="1.8"/>

      <rect x="560" y="560" width="380" height="80" rx="6" fill="#EFE8F6" stroke="#8E74B5" stroke-width="1"/>

      <text x="750" y="616" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">旧展示作废、按新库重读</text>

      <!-- 注记：恢复的两条边界 -->
      <rect x="40" y="420" width="3" height="130" rx="1" fill="#8A94A3"/>
      <text x="56" y="438" font-size="12" font-weight="600" fill="#6F6357">恢复的两条边界</text>
      <text x="56" y="466" font-size="12" fill="#6F6357">二次确认之后才发命令</text>

      <text x="56" y="518" font-size="12" fill="#6F6357">库身份一变就自动解禁</text>
      <text x="56" y="544" font-size="12" fill="#6F6357">打不开位置时可复制路径</text>

      <text x="216" y="694" font-size="12" fill="#6F6357">导出 / 备份 / 恢复</text>
      <rect x="390" y="684" width="18" height="12" rx="2" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
      <text x="416" y="694" font-size="12" fill="#6F6357">文件与库</text>
      <rect x="520" y="684" width="18" height="12" rx="2" fill="#F6E4BE" stroke="#CBA758" stroke-width="1.6"/>

      <rect x="650" y="684" width="18" height="12" rx="2" fill="#EFE8F6" stroke="#8E74B5" stroke-width="1"/>
      <text x="676" y="694" font-size="12" fill="#6F6357">库身份变化的广播</text>
      <line x1="840" y1="690" x2="876" y2="690" stroke="#6F6357" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="884" y="694" font-size="12" fill="#6F6357">回执路径</text>
      <text x="28" y="722" font-size="12" fill="#6F6357">导出与备份都只是写文件：页面显示绝对路径与大小，可以点「打开所在位置」再定位一次；同名产物不会被覆盖。</text>
      <text x="28" y="746" font-size="12" fill="#6F6357">备份只保留最近 5 份；恢复之后库身份会变，第二个窗口也会一起换成新库，旧展示一律作废重读。</text>
    </svg>
    <figcaption>图 6 · 导出与备份 / 恢复。色相＝功能类别（蓝＝数据页、青＝动作、琥珀＝文件与库、紫＝库身份广播），明度＝作用程度（“强”档只给换库）。</figcaption>
  </figure>
