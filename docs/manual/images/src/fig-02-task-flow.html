<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>图 2 · 任务状态流转 — Worktrace 用户使用说明书</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  html,body{margin:0;padding:0;background:#FBF9F6;color:#2A2320;}
  body{font-family:'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;}
  main{max-width:1080px;margin:0 auto;padding:48px 32px 64px;}
  .eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6F6357;margin:0 0 8px;}
  h1{font-family:'Instrument Serif','Noto Serif SC',serif;font-weight:400;font-size:34px;margin:0 0 8px;}
  .sub{color:#6F6357;font-size:15px;margin:0 0 28px;}
  figure{margin:0;border:1px solid rgba(42,35,32,.12);border-radius:8px;background:#ffffff;padding:16px;overflow-x:auto;}
  figcaption{font-size:13px;color:#6F6357;margin-top:12px;}
  footer{border-top:1px solid rgba(42,35,32,.10);margin-top:32px;padding-top:12px;color:#6F6357;font-size:12px;font-family:'Geist Mono',ui-monospace,monospace;}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Worktrace 用户使用说明书 · 图 2</p>
  <h1>任务状态流转：从捕获到完成，以及四个出口</h1>
  <p class="sub">主干是收件箱 → 理清 → 就绪 → 进行中；阻塞、等待中、完成、已取消四个出口各自怎么出去、怎么回来。</p>
  <figure>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img"
         aria-labelledby="fig-02-task-flow-title fig-02-task-flow-desc"
         font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
      <title id="fig-02-task-flow-title">任务状态流转：主干与四个出口</title>
      <desc id="fig-02-task-flow-desc">任务状态的主干是 Inbox 到 Clarifying 到 Ready 到 Doing：从收件箱点「置为 Ready」理清，点「开始」进入 Doing，也可以在 Inbox 上直接点「开始」，理清与开工在同一步完成。Ready 或 Doing 可以走到 Blocked（阻塞）、Waiting（等待中）、Done（完成）、Cancelled（已取消）；Blocked 与 Waiting 用「恢复为可执行」回到 Ready；Done 与 Cancelled 只能用「重开」回到 Ready，且不会恢复旧会话。完成与取消会结束这条任务正在跑的会话，阻塞与等待中会暂停它。</desc>
      <defs>
        <marker id="fig-02-task-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
        </marker>
      </defs>

      <rect x="0" y="0" width="1000" height="820" fill="#FBF9F6"/>

      <!-- 箭头先画 -->
      <path d="M208,178 H296" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M128,140 V96 Q128,88 136,88 H600 Q608,88 608,96 V140" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M456,178 H544" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M704,178 H792" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M608,216 V340" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M640,340 V216" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M856,216 V340" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M888,340 V268 Q888,260 880,260 H680 Q672,260 672,252 V216" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M544,202 H508 Q500,202 500,210 V530 Q500,538 508,538 H544" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M952,202 H968 Q976,202 976,210 V530 Q976,538 968,538 H952" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M824,576 V612 Q824,620 816,620 H488 Q480,620 480,612 V128 Q480,120 488,120 H552 Q560,120 560,128 V140" fill="none" stroke="#6F6357" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fig-02-task-flow-arrow)"/>
      <path d="M672,576 V636 Q672,644 664,644 H448 Q440,644 440,636 V112 Q440,104 448,104 H664 Q672,104 672,112 V140" fill="none" stroke="#6F6357" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fig-02-task-flow-arrow)"/>

      <!-- 箭头标签：蒙版 + 文字，与线留 6–10px 空隙 -->
      <rect x="228" y="150" width="48" height="20" rx="2" fill="#FBF9F6"/>
      <text x="252" y="165" font-size="12" fill="#6F6357" text-anchor="middle">理清</text>
      <rect x="306" y="94" width="132" height="20" rx="2" fill="#FBF9F6"/>
      <text x="372" y="109" font-size="12" fill="#6F6357" text-anchor="middle">「开始」＝理清并开工</text>
      <rect x="464" y="150" width="72" height="20" rx="2" fill="#FBF9F6"/>
      <text x="500" y="165" font-size="12" fill="#6F6357" text-anchor="middle">置为 Ready</text>
      <rect x="732" y="150" width="32" height="20" rx="2" fill="#FBF9F6"/>
      <text x="748" y="165" font-size="12" fill="#6F6357" text-anchor="middle">开始</text>
      <rect x="568" y="250" width="32" height="20" rx="2" fill="#FBF9F6"/>
      <text x="584" y="265" font-size="12" fill="#6F6357" text-anchor="middle">阻塞</text>
      <rect x="648" y="250" width="76" height="20" rx="2" fill="#FBF9F6"/>
      <text x="686" y="265" font-size="12" fill="#6F6357" text-anchor="middle">恢复为可执行</text>
      <rect x="864" y="230" width="44" height="20" rx="2" fill="#FBF9F6"/>
      <text x="886" y="245" font-size="12" fill="#6F6357" text-anchor="middle">等待中</text>
      <rect x="707" y="266" width="76" height="20" rx="2" fill="#FBF9F6"/>
      <text x="745" y="281" font-size="12" fill="#6F6357" text-anchor="middle">恢复为可执行</text>
      <rect x="460" y="390" width="32" height="20" rx="2" fill="#FBF9F6"/>
      <text x="476" y="405" font-size="12" fill="#6F6357" text-anchor="middle">完成</text>
      <rect x="936" y="250" width="32" height="20" rx="2" fill="#FBF9F6"/>
      <text x="952" y="265" font-size="12" fill="#6F6357" text-anchor="middle">取消</text>
      <rect x="724" y="596" width="32" height="20" rx="2" fill="#FBF9F6"/>
      <text x="740" y="611" font-size="12" fill="#6F6357" text-anchor="middle">重开</text>
      <rect x="544" y="650" width="32" height="20" rx="2" fill="#FBF9F6"/>
      <text x="560" y="665" font-size="12" fill="#6F6357" text-anchor="middle">重开</text>

      <!-- 主干四个状态 -->
      <rect x="48" y="140" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="128" y="172" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">Inbox</text>
      <text x="128" y="196" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">刚捕获，未理清</text>

      <rect x="296" y="140" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="376" y="172" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">Clarifying</text>
      <text x="376" y="196" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">正在理清下一步</text>

      <rect x="544" y="140" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="624" y="172" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">Ready</text>
      <text x="624" y="196" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">想清楚了，随时能做</text>

      <rect x="792" y="140" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="872" y="172" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">Doing</text>
      <text x="872" y="196" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">正在做</text>

      <!-- 出口：阻塞 / 等待中 -->
      <rect x="544" y="340" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="624" y="372" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">Blocked</text>
      <text x="624" y="396" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">我做不了</text>

      <rect x="792" y="340" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="872" y="372" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">Waiting</text>
      <text x="872" y="396" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">等外部</text>

      <!-- 终态：完成（本图唯一“强”档焦点）/ 已取消 -->
      <rect x="544" y="500" width="160" height="76" rx="6" fill="#F6CCBC" stroke="#D9603A" stroke-width="1.8"/>
      <text x="624" y="532" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">Done</text>
      <text x="624" y="556" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">已完成</text>

      <rect x="792" y="500" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="872" y="532" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">Cancelled</text>
      <text x="872" y="556" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">已取消</text>

      <!-- 注记：跃迁与会话的联动（本图的焦点口径） -->
      <rect x="48" y="300" width="3" height="150" rx="1" fill="#8A94A3"/>
      <text x="64" y="318" font-size="12" font-weight="600" fill="#6F6357">跃迁会同时动到会话</text>
      <text x="64" y="348" font-size="12" fill="#6F6357">完成 / 取消：结束这条任务正在跑的会话</text>
      <text x="64" y="376" font-size="12" fill="#6F6357">阻塞 / 等待中：暂停它</text>
      <text x="64" y="404" font-size="12" fill="#6F6357">重开：只放回 Ready，不恢复旧会话</text>

      <rect x="48" y="460" width="3" height="106" rx="1" fill="#8A94A3"/>
      <text x="64" y="478" font-size="12" font-weight="600" fill="#6F6357">界面上没有单独按钮的两个状态</text>
      <text x="64" y="506" font-size="12" fill="#6F6357">Clarifying（理清中）：只有「置为 Ready」</text>
      <text x="64" y="530" font-size="12" fill="#6F6357">Review（待检查）：跃迁表允许，界面没有入口</text>
      <text x="64" y="554" font-size="12" fill="#6F6357">Scheduled（已排期）：V0.2 开放，现在写入被拒</text>

      <!-- 图例：底部横条 -->
      <line x1="28" y1="700" x2="972" y2="700" stroke="#2A2320" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="28" y="722" font-size="12" font-weight="600" fill="#6F6357">图例</text>
      <rect x="68" y="712" width="18" height="12" rx="2" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="94" y="722" font-size="12" fill="#6F6357">任务状态</text>
      <rect x="190" y="712" width="18" height="12" rx="2" fill="#F6CCBC" stroke="#D9603A" stroke-width="1.6"/>
      <text x="216" y="722" font-size="12" fill="#6F6357">焦点：完成（终态）</text>
      <line x1="356" y1="718" x2="392" y2="718" stroke="#6F6357" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="400" y="722" font-size="12" fill="#6F6357">重开：终态唯一的出边</text>
      <text x="28" y="750" font-size="12" fill="#6F6357">注：本图画的是常见动线；同一张跃迁表里还允许——Inbox / Clarifying 可直接置为 Ready 或直接取消，Clarifying 可退回收件箱；</text>
      <text x="28" y="774" font-size="12" fill="#6F6357">Ready 另可直接到 Blocked / Waiting / Done / Cancelled；Doing 另可直接退回 Ready 或直接取消；</text>
      <text x="28" y="798" font-size="12" fill="#6F6357">Blocked / Waiting 的出口只有 Ready 与 Cancelled；Done / Cancelled 只能靠显式「重开」回 Ready。</text>
    </svg>
    <figcaption>图 2 · 任务状态流转。色相＝功能类别（橙红＝任务状态），明度＝作用程度（“强”档只给完成）。虚线＝只能显式触发的「重开」。</figcaption>
  </figure>
  <footer>source docs/manual/images/src/fig-02-task-flow.html · export docs/manual/images/fig-02-task-flow.svg</footer>
</main>
</body>
</html>
