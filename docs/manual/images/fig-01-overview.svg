<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" width="1000" height="648" role="img"
         aria-labelledby="fig-01-overview-title fig-01-overview-desc"
         font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
      <title id="fig-01-overview-title">Worktrace 应用总览：八块页面、托盘与状态栏</title>
      <desc id="fig-01-overview-desc">Worktrace 主窗由收件箱、项目、任务、计时、今日、恢复、历史、数据八块页面组成，默认页是收件箱。窗口外的托盘菜单五项依次是当前任务、暂停、快速捕获、完成、退出，其中快速捕获跳转到收件箱、当前任务跳转到计时页，关闭全部窗口后托盘仍可用且计时继续。窗口底部状态栏显示连接状态、当前任务、会话状态与已计时。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');</style>
        <marker id="fig-01-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
        </marker>
      </defs>

      <rect x="0" y="0" width="1000" height="648" fill="#FBF9F6"/>

      <!-- 分区（先画背景分区，再画箭头，最后画方框） -->
      <rect x="28" y="40" width="944" height="124" rx="8" fill="#8A94A3" fill-opacity="0.07" stroke="#8A94A3" stroke-opacity="0.34" stroke-width="0.8"/>
      <rect x="28" y="188" width="944" height="304" rx="8" fill="#6B9BC7" fill-opacity="0.05" stroke="#6B9BC7" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="44" y="62" font-size="12" font-weight="500" fill="#6F6357">托盘菜单：五项（窗口全部关掉后仍可用，计时继续）</text>
      <text x="44" y="210" font-size="12" font-weight="500" fill="#6F6357">主窗口（八个页面 · 点左侧导航切换）</text>

      <!-- 箭头（先画线，方框后画，保证线在框下） -->
      <path d="M200,148 V228" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-01-overview-arrow)"/>
      <path d="M851,148 V228" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-01-overview-arrow)"/>
      <path d="M478,382 H522" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-01-overview-arrow)"/>
      <path d="M946,266 H956 Q964,266 964,274 V520" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-01-overview-arrow)"/>

      <!-- 箭头标签：蒙版 + 文字，与线留 6–10px 空隙 -->
      <rect x="206" y="178" width="96" height="20" rx="2" fill="#FBF9F6"/>
      <text x="212" y="192" font-size="12" fill="#6F6357">快速捕获跳转</text>
      <rect x="857" y="178" width="96" height="20" rx="2" fill="#FBF9F6"/>
      <text x="863" y="192" font-size="12" fill="#6F6357">当前任务跳转</text>
      <rect x="482" y="390" width="36" height="20" rx="2" fill="#FBF9F6"/>
      <text x="500" y="404" font-size="12" fill="#6F6357" text-anchor="middle">事后</text>
      <rect x="870" y="496" width="88" height="20" rx="2" fill="#FBF9F6"/>
      <text x="952" y="510" font-size="12" fill="#6F6357" text-anchor="end">同一条会话</text>

      <!-- 托盘菜单：一个节点，五项按顺序排列 -->
      <rect x="44" y="76" width="912" height="72" rx="8" fill="#E8EBF0" stroke="#8A94A3" stroke-width="1"/>
      <line x1="226" y1="92" x2="226" y2="132" stroke="#8A94A3" stroke-opacity="0.35" stroke-width="0.8"/>
      <line x1="409" y1="92" x2="409" y2="132" stroke="#8A94A3" stroke-opacity="0.35" stroke-width="0.8"/>
      <line x1="591" y1="92" x2="591" y2="132" stroke="#8A94A3" stroke-opacity="0.35" stroke-width="0.8"/>
      <line x1="774" y1="92" x2="774" y2="132" stroke="#8A94A3" stroke-opacity="0.35" stroke-width="0.8"/>
      <text x="135" y="102" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" fill="#6F6357" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="318" y="102" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" fill="#6F6357" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="500" y="102" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" fill="#6F6357" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="682" y="102" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" fill="#6F6357" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="865" y="102" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" fill="#6F6357" text-anchor="middle" letter-spacing="0.08em">05</text>
      <text x="135" y="128" font-size="12" font-weight="500" fill="#2A2320" text-anchor="middle">当前任务</text>
      <text x="318" y="128" font-size="12" font-weight="500" fill="#2A2320" text-anchor="middle">暂停</text>
      <text x="500" y="128" font-size="12" font-weight="500" fill="#2A2320" text-anchor="middle">快速捕获</text>
      <text x="682" y="128" font-size="12" font-weight="500" fill="#2A2320" text-anchor="middle">完成</text>
      <text x="865" y="128" font-size="12" font-weight="500" fill="#2A2320" text-anchor="middle">退出</text>

      <!-- 收件箱：默认页，本图唯一的“强”档焦点 -->
      <rect x="54" y="228" width="190" height="76" rx="6" fill="#D0E0EF" stroke="#6B9BC7" stroke-width="1.8"/>
      <rect x="186" y="234" width="52" height="18" rx="2" fill="#6B9BC7" fill-opacity="0.16" stroke="#6B9BC7" stroke-opacity="0.55" stroke-width="0.8"/>
      <text x="212" y="247" font-size="12" font-weight="500" fill="#2A2320" text-anchor="middle">默认页</text>
      <text x="149" y="258" font-size="13" font-weight="600" fill="#2A2320" text-anchor="middle">收件箱</text>
      <text x="149" y="282" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">捕获 · 理清 · 推进</text>

      <!-- 其余七块页面：同一色相，中档 -->
      <rect x="288" y="228" width="190" height="76" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="383" y="258" font-size="13" font-weight="600" fill="#2A2320" text-anchor="middle">项目</text>
      <text x="383" y="282" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">创建 · 改名 · 归档</text>

      <rect x="522" y="228" width="190" height="76" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="617" y="258" font-size="13" font-weight="600" fill="#2A2320" text-anchor="middle">任务</text>
      <text x="617" y="282" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">下一步 · 等待中 · 阻塞</text>

      <rect x="756" y="228" width="190" height="76" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="851" y="258" font-size="13" font-weight="600" fill="#2A2320" text-anchor="middle">计时</text>
      <text x="851" y="282" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">暂停 · 继续 · 结束</text>

      <rect x="54" y="344" width="190" height="76" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="149" y="374" font-size="13" font-weight="600" fill="#2A2320" text-anchor="middle">今日</text>
      <text x="149" y="398" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">五项 · 同一次读取</text>

      <rect x="288" y="344" width="190" height="76" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="383" y="374" font-size="13" font-weight="600" fill="#2A2320" text-anchor="middle">恢复</text>
      <text x="383" y="398" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">待确认 · 记录损坏</text>

      <rect x="522" y="344" width="190" height="76" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="617" y="374" font-size="13" font-weight="600" fill="#2A2320" text-anchor="middle">历史</text>
      <text x="617" y="398" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">修正 · 删除 · 补录</text>

      <rect x="756" y="344" width="190" height="76" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="851" y="374" font-size="13" font-weight="600" fill="#2A2320" text-anchor="middle">数据</text>
      <text x="851" y="398" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">导出 · 备份 · 恢复</text>

      <!-- 状态栏：主窗底部的横条 -->
      <rect x="54" y="520" width="892" height="36" rx="6" fill="#EFF3F6" stroke="#A8C3DB" stroke-width="0.8"/>
      <text x="70" y="543" font-size="12" font-weight="500" fill="#6F6357">状态栏：连接状态 · 当前计时（任务标题 · 运行中 00:12）</text>

      <!-- 图例：底部横条 -->
      <line x1="28" y1="580" x2="972" y2="580" stroke="#2A2320" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="28" y="602" font-size="12" font-weight="600" fill="#6F6357">图例</text>
      <rect x="68" y="592" width="18" height="12" rx="2" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="94" y="602" font-size="12" fill="#6F6357">界面页面（八块）</text>
      <rect x="210" y="592" width="18" height="12" rx="2" fill="#D0E0EF" stroke="#6B9BC7" stroke-width="1.6"/>
      <text x="236" y="602" font-size="12" fill="#6F6357">默认页（焦点）</text>
      <rect x="350" y="592" width="18" height="12" rx="2" fill="#E8EBF0" stroke="#8A94A3" stroke-width="1"/>
      <text x="376" y="602" font-size="12" fill="#6F6357">托盘菜单（平台）</text>
      <rect x="500" y="592" width="18" height="12" rx="2" fill="#EFF3F6" stroke="#A8C3DB" stroke-width="0.8"/>
      <text x="526" y="602" font-size="12" fill="#6F6357">状态栏</text>
      <text x="28" y="628" font-size="12" fill="#6F6357">导航顺序：收件箱 → 项目 → 任务 → 计时 → 今日 → 恢复 → 历史 → 数据（默认页是收件箱）；恢复与历史是事后处理——先处理待确认，再修正 / 补录。</text>
    </svg>
