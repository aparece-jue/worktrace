<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" role="img"
         aria-labelledby="fig-03-timer-lifecycle-title fig-03-timer-lifecycle-desc"
         font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
      <title id="fig-03-timer-lifecycle-title">一次计时会话的生命周期与区间归属</title>
      <desc id="fig-03-timer-lifecycle-desc">在收件箱点「开始」后任务变成 Doing，会话进入运行中，已计时开始增长；点「暂停」进入已暂停，已计时冻结不再增长；点「继续」回到运行中接着涨；点「结束」进入已结束，操作按钮消失，这一段落到今天。暂停状态下也能直接结束。下方时间轴用一次真实验收的样本说明同一段挂钟时间被记成什么：两个已确认区间分别是 46 秒和 31 秒，中间暂停的 62 秒不计入任何一栏；结束后重新开始是一条新会话，当前还在跑的那一段是开放区间，只算暂计。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');</style>
        <marker id="fig-03-timer-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
        </marker>
      </defs>

      <rect x="0" y="0" width="1000" height="710" fill="#FBF9F6"/>

      <!-- 箭头先画 -->
      <path d="M208,158 H282" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-03-timer-lifecycle-arrow)"/>
      <path d="M448,158 H522" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-03-timer-lifecycle-arrow)"/>
      <path d="M528,182 H454" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-03-timer-lifecycle-arrow)"/>
      <path d="M352,196 V290" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-03-timer-lifecycle-arrow)"/>
      <path d="M608,196 V260 Q608,268 600,268 H392 Q384,268 384,276 V290" fill="none" stroke="#6F6357" stroke-width="1.2" marker-end="url(#fig-03-timer-lifecycle-arrow)"/>

      <!-- 箭头标签 -->
      <rect x="224" y="130" width="48" height="20" rx="2" fill="#FBF9F6"/>
      <text x="248" y="145" font-size="12" fill="#6F6357" text-anchor="middle">开始</text>
      <rect x="464" y="130" width="48" height="20" rx="2" fill="#FBF9F6"/>
      <text x="488" y="145" font-size="12" fill="#6F6357" text-anchor="middle">暂停</text>
      <rect x="464" y="190" width="48" height="20" rx="2" fill="#FBF9F6"/>
      <text x="488" y="205" font-size="12" fill="#6F6357" text-anchor="middle">继续</text>
      <rect x="312" y="240" width="32" height="20" rx="2" fill="#FBF9F6"/>
      <text x="328" y="255" font-size="12" fill="#6F6357" text-anchor="middle">结束</text>
      <rect x="446" y="240" width="108" height="20" rx="2" fill="#FBF9F6"/>
      <text x="500" y="255" font-size="12" fill="#6F6357" text-anchor="middle">暂停中也能直接结束</text>

      <!-- 会话状态机 -->
      <rect x="48" y="120" width="160" height="76" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
      <text x="128" y="152" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">开始</text>
      <text x="128" y="176" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">Ready / Inbox → Doing</text>

      <rect x="288" y="120" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="368" y="152" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">运行中</text>
      <text x="368" y="176" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">已计时在涨</text>

      <rect x="528" y="120" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="608" y="152" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">已暂停</text>
      <text x="608" y="176" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">已计时冻结</text>

      <rect x="288" y="290" width="160" height="76" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="368" y="322" font-size="14" font-weight="600" fill="#2A2320" text-anchor="middle">已结束</text>
      <text x="368" y="346" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">这一段落到今天</text>

      <!-- 时间轴：同一段时间被记成什么 -->
      <text x="48" y="440" font-size="12" font-weight="600" fill="#6F6357">这段时间最后被记成什么，由会话状态决定</text>
      <text x="670" y="446" font-size="12" fill="#6F6357" text-anchor="middle">新会话</text>
      <line x1="670" y1="452" x2="670" y2="520" stroke="#8A94A3" stroke-width="0.8" stroke-dasharray="4,3"/>

      <rect x="80" y="460" width="220" height="36" rx="4" fill="#D6E9E6" stroke="#6FAFA8" stroke-width="1.8"/>
      <text x="190" y="483" font-size="12" font-weight="500" fill="#2A2320" text-anchor="middle">已确认 46 秒</text>

      <rect x="300" y="460" width="220" height="36" rx="4" fill="#F2F2F3" stroke="#BABEC6" stroke-width="0.8"/>
      <text x="410" y="483" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">暂停 62 秒 · 不计入</text>

      <rect x="520" y="460" width="140" height="36" rx="4" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
      <text x="590" y="483" font-size="12" font-weight="500" fill="#2A2320" text-anchor="middle">已确认 31 秒</text>

      <rect x="680" y="460" width="240" height="36" rx="4" fill="#F0F5F2" stroke="#AACEC9" stroke-width="0.8" stroke-dasharray="5,4"/>
      <text x="800" y="483" font-size="12" font-weight="500" fill="#6F6357" text-anchor="middle">开放区间 · 暂计中</text>

      <line x1="80" y1="520" x2="920" y2="520" stroke="#2A2320" stroke-opacity="0.18" stroke-width="0.8"/>
      <line x1="920" y1="514" x2="920" y2="526" stroke="#2A2320" stroke-opacity="0.18" stroke-width="0.8"/>
      <text x="920" y="544" font-size="12" fill="#6F6357" text-anchor="end">现在</text>
      <text x="370" y="544" font-size="12" fill="#6F6357" text-anchor="middle">会话 1：已结束（46 秒 + 31 秒）</text>
      <text x="800" y="544" font-size="12" fill="#6F6357" text-anchor="middle">会话 2：运行中</text>

      <!-- 图例：底部横条 -->
      <line x1="28" y1="586" x2="972" y2="586" stroke="#2A2320" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="28" y="608" font-size="12" font-weight="600" fill="#6F6357">图例</text>
      <rect x="68" y="598" width="18" height="12" rx="2" fill="#D6E9E6" stroke="#6FAFA8" stroke-width="1.6"/>
      <text x="94" y="608" font-size="12" fill="#6F6357">已确认区间（计入工时）</text>
      <rect x="290" y="598" width="18" height="12" rx="2" fill="#F0F5F2" stroke="#AACEC9" stroke-width="0.8"/>
      <text x="316" y="608" font-size="12" fill="#6F6357">开放区间（暂计）</text>
      <rect x="470" y="598" width="18" height="12" rx="2" fill="#F2F2F3" stroke="#BABEC6" stroke-width="0.8"/>
      <text x="496" y="608" font-size="12" fill="#6F6357">暂停（不计入任何一栏）</text>
      <rect x="700" y="598" width="18" height="12" rx="2" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
      <text x="726" y="608" font-size="12" fill="#6F6357">会话状态</text>
      <text x="28" y="636" font-size="12" fill="#6F6357">已确认区间（已经闭合、可信的那一段）：计入工时——只有它会进今日页的「确认人工工时」。</text>
      <text x="28" y="660" font-size="12" fill="#6F6357">开放区间（还在跑、还没结束的那一段）：只算暂计，结束之前不算已确认。</text>
      <text x="28" y="684" font-size="12" fill="#6F6357">暂停：既不是已确认，也不是暂计，任何一栏都不进；结束后重新开始是一条新会话。</text>
    </svg>
