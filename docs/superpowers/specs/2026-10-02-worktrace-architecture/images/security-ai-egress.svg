<svg viewBox="0 0 1000 660" role="img" aria-labelledby="sec-egress-title sec-egress-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="sec-egress-title">Worktrace 保密等级与 AI 外发边界</title>
  <desc id="sec-egress-desc">本机（可信）与云 AI（外部）之间是一条外发边界，跨过它只有一条通路：M09 上下文按条目保密等级做白名单与保密过滤，构造出的白名单 Context Bundle 经 AI Gateway 闸门校验，交给闸门之后的 M10 AI，再由 M10 调用云端提供商。左侧四档保密等级自上而下是 STRICT_LOCAL、CONFIDENTIAL、INTERNAL、PUBLIC，是同一色相的有序阶梯，颜色越深约束越强，默认 STRICT_LOCAL；STRICT_LOCAL 绝对禁止，CONFIDENTIAL 默认禁止，图示默认阻断分支，其虚线通路在外发边界之前以停止符号终止，INTERNAL 需绑定项目、提供商与端点授权、PUBLIC 在启用云 AI 后可发送，两者经 M09 进入外发链路。本机域内另列四条约束：派生摘要与提取缓存继承最严格来源等级；日志只记录 ID、等级与计数，不记录机密正文；凭据使用系统凭据存储，不放 SQLite 或前端 localStorage；模型建议的采纳不等于外发授权。</desc>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap');</style>
    <marker id="se-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FBF9F6"/>

  <!-- ===== 区域与外发边界（z 序最底） ===== -->
  <rect x="32" y="88" width="672" height="452" rx="6" fill="rgba(42,35,32,0.02)"
        stroke="rgba(42,35,32,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="48" y="107" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">本机 · 本地处理</text>

  <rect x="788" y="88" width="180" height="452" rx="6" fill="rgba(42,35,32,0.02)"
        stroke="rgba(42,35,32,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="804" y="107" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">云 AI · 外部</text>

  <rect x="272" y="408" width="420" height="112" rx="6"
        fill="rgba(203,167,88,0.08)" stroke="rgba(203,167,88,0.45)" stroke-width="1"/>
  <text x="288" y="428" fill="#6F6357" font-size="7.5" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">边界内约束</text>
  <g font-size="8.5" font-family="'Geist',sans-serif" fill="#6F6357">
    <text x="288" y="450">派生摘要 / 提取缓存继承最严格来源等级</text>
    <text x="288" y="470">日志只记录 ID、等级与计数，不记录机密正文</text>
    <text x="288" y="490">凭据使用系统凭据存储，不放 SQLite 或前端 localStorage</text>
    <text x="288" y="510">模型建议的采纳不等于外发授权</text>
  </g>

  <path d="M 722 96 V 532" fill="none" stroke="#6F6357" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="722" y="80" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em" text-anchor="middle">外发边界</text>

  <!-- ===== 连线（先画） ===== -->
  <!-- 两组分级的外括号：禁止外发组 / 可外发组 -->
  <path d="M 212 140 H 222 V 300 H 212" fill="none" stroke="#6F6357" stroke-width="1"/>
  <path d="M 212 316 H 222 V 476 H 212" fill="none" stroke="#6F6357" stroke-width="1"/>

  <!-- STRICT_LOCAL 绝对禁止、CONFIDENTIAL 默认禁止：默认分支在边界前终止 -->
  <path d="M 222 220 H 264 Q 272 220 272 212 V 204 Q 272 196 280 196 H 716"
        fill="none" stroke="#D9603A" stroke-width="1.2" stroke-dasharray="5,4"/>
  <path d="M 716 182 V 210" fill="none" stroke="#D9603A" stroke-width="1.8"/>

  <!-- INTERNAL / PUBLIC：经 M09 进入外发链路 -->
  <path d="M 222 396 H 320 Q 328 396 328 388 V 364"
        fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#se-arrow)"/>

  <!-- 外发链路：M09 → 闸门 → M10 → 云 -->
  <path d="M 400 308 H 472" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#se-arrow)"/>
  <path d="M 524 308 H 596" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#se-arrow)"/>
  <path d="M 684 308 H 806" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#se-arrow)"/>

  <!-- ===== 连线标签（遮罩在方框之前，且不压任何方框） ===== -->
  <g font-size="8.5" font-family="'Geist',sans-serif" text-anchor="middle" fill="#6F6357">
    <rect x="476" y="176" width="88" height="12" rx="2" fill="#FBF9F6"/>
    <text x="520" y="185" fill="#D9603A">目标授权不足以放行</text>
    <rect x="264" y="376" width="52" height="12" rx="2" fill="#FBF9F6"/>
    <text x="290" y="385">按等级过滤</text>
    <rect x="419" y="288" width="34" height="12" rx="2" fill="#FBF9F6"/>
    <text x="436" y="297">白名单</text>
    <rect x="539" y="288" width="42" height="12" rx="2" fill="#FBF9F6"/>
    <text x="560" y="297">已过闸门</text>
    <rect x="734" y="288" width="52" height="12" rx="2" fill="#FBF9F6"/>
    <text x="760" y="297">提供商调用</text>
  </g>

  <!-- ===== 四档保密等级：同一色相的有序阶梯，色深＝约束强度 ===== -->
  <rect x="48" y="140" width="164" height="72" rx="6" fill="#FBF9F6"/>
  <rect x="48" y="140" width="164" height="72" rx="6" fill="#E7CE97" stroke="#87661A" stroke-width="1"/>
  <text x="64" y="168" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist Mono',monospace">STRICT_LOCAL</text>
  <text x="64" y="190" fill="#4A3F33" font-size="8.5" font-family="'Geist',sans-serif">不可授权绕过 · 须先重分类</text>

  <rect x="48" y="228" width="164" height="72" rx="6" fill="#FBF9F6"/>
  <rect x="48" y="228" width="164" height="72" rx="6" fill="#F1E0B9" stroke="#AB8834" stroke-width="1"/>
  <text x="64" y="256" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist Mono',monospace">CONFIDENTIAL</text>
  <text x="64" y="278" fill="#4A3F33" font-size="8.5" font-family="'Geist',sans-serif">默认禁止云端</text>

  <rect x="48" y="316" width="164" height="72" rx="6" fill="#FBF9F6"/>
  <rect x="48" y="316" width="164" height="72" rx="6" fill="#F8EFD9" stroke="#C4A96A" stroke-width="1"/>
  <text x="64" y="344" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist Mono',monospace">INTERNAL</text>
  <text x="64" y="366" fill="#4A3F33" font-size="8.5" font-family="'Geist',sans-serif">绑定项目 · 提供商 · 端点</text>

  <rect x="48" y="404" width="164" height="72" rx="6" fill="#FBF9F6"/>
  <rect x="48" y="404" width="164" height="72" rx="6" fill="#FCF7EB" stroke="#D8C79E" stroke-width="1"/>
  <text x="64" y="432" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist Mono',monospace">PUBLIC</text>
  <text x="64" y="454" fill="#4A3F33" font-size="8.5" font-family="'Geist',sans-serif">启用云 AI 后可发送</text>

  <!-- ===== 外发链路三个节点 ===== -->
  <rect x="272" y="252" width="128" height="112" rx="6" fill="#FBF9F6"/>
  <rect x="272" y="252" width="128" height="112" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="336" y="302" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M09 上下文</text>
  <text x="336" y="324" fill="#4A3F33" font-size="8.5" font-family="'Geist',sans-serif"
        text-anchor="middle">白名单与保密过滤</text>

  <rect x="472" y="228" width="52" height="160" rx="6" fill="#FBF9F6"/>
  <rect x="472" y="228" width="52" height="160" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="498" y="288" fill="#8A4A2C" font-size="7" font-family="'Geist Mono',monospace"
        text-anchor="middle">AI</text>
  <text x="498" y="300" fill="#8A4A2C" font-size="7" font-family="'Geist Mono',monospace"
        text-anchor="middle">GATEWAY</text>
  <text x="498" y="322" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">闸门</text>

  <rect x="596" y="252" width="88" height="112" rx="6" fill="#FBF9F6"/>
  <rect x="596" y="252" width="88" height="112" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="640" y="300" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M10 AI</text>
  <text x="640" y="322" fill="#4A3F33" font-size="8.5" font-family="'Geist',sans-serif"
        text-anchor="middle">提供商调用</text>

  <!-- ===== 云 AI（外部） ===== -->
  <rect x="806" y="252" width="144" height="112" rx="6" fill="#FBF9F6"/>
  <rect x="806" y="252" width="144" height="112" rx="6" fill="#EFEAE4" stroke="#A2968A" stroke-width="1"/>
  <text x="878" y="300" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">云端 AI 提供商</text>
  <text x="878" y="322" fill="#4A3F33" font-size="8.5" font-family="'Geist',sans-serif"
        text-anchor="middle">外发目的地</text>

  <!-- ===== 注记 ===== -->
  <text x="32" y="570" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    AI Gateway 只接收 M09 构造的白名单 Context Bundle；M09 负责白名单与保密过滤，M10 AI 模块在闸门之后。</text>
  <text x="32" y="588" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    分类与授权分别校验；STRICT_LOCAL 不可绕过，目标授权绑定项目、提供商与规范化端点，发送前再次检查。</text>

  <!-- ===== 图例（底部横条） ===== -->
  <path d="M 32 618 H 968" fill="none" stroke="rgba(42,35,32,0.14)" stroke-width="0.8"/>
  <text x="32" y="638" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">LEGEND</text>

  <rect x="110" y="629" width="16" height="10" rx="2" fill="#E7CE97" stroke="#87661A" stroke-width="1"/>
  <rect x="126" y="629" width="16" height="10" rx="2" fill="#F1E0B9" stroke="#AB8834" stroke-width="1"/>
  <rect x="142" y="629" width="16" height="10" rx="2" fill="#F8EFD9" stroke="#C4A96A" stroke-width="1"/>
  <rect x="158" y="629" width="16" height="10" rx="2" fill="#FCF7EB" stroke="#D8C79E" stroke-width="1"/>
  <text x="182" y="638" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">保密等级 · 色深＝约束强度</text>

  <rect x="340" y="629" width="16" height="10" rx="2" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="364" y="638" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">M09 / M10 模块</text>

  <rect x="520" y="629" width="16" height="10" rx="2" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="544" y="638" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">AI Gateway 闸门</text>

  <rect x="680" y="629" width="16" height="10" rx="2" fill="#EFEAE4" stroke="#A2968A" stroke-width="1"/>
  <text x="704" y="638" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">云 AI · 外部</text>

  <path d="M 796 634 H 830" fill="none" stroke="#D9603A" stroke-width="1.2" stroke-dasharray="5,4"/>
  <rect x="829" y="628" width="2" height="12" fill="#D9603A"/>
  <text x="844" y="638" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">禁止外发路径</text>

  <path d="M 916 628 V 640" fill="none" stroke="#6F6357" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="932" y="638" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">外发边界</text>
</svg>
