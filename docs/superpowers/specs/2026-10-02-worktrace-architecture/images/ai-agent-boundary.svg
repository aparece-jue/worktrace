<svg viewBox="0 0 1000 970" role="img" aria-labelledby="aib-title aib-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="aib-title">Worktrace 的 AI 输入边界与外部 Agent 分工</title>
  <desc id="aib-desc">左侧一列是数据流：源文件先交给外部 Agent 与配套 skill，由它们读文件、做 OCR 与正文分析，输出 schema_version=1 的 JSON 批次；批次进入应用的导入事务，经本地校验、预览来源与冲突、逐项采纳与去重后才落成应用记录，未采纳条目不进入业务实体。应用记录再经用户本次选择才组包，在预览实际输入并确认目的地后，由 M10 调用云 AI 提供商；AI 默认关闭，这一步是全图唯一的人工闸门，也是强调项。右侧注记板列出应用刻意不做的事（不读文件正文、不扫描目录、不跟踪源文件、不持有提取缓存、不执行导入文本里的命令、不自动访问引用）以及文件引用的存放规则。</desc>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap');</style>
    <marker id="aib-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
    </marker>
    <marker id="aib-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D9603A"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FBF9F6"/>

  <!-- ===== 右侧注记板（分区，先画） ===== -->
  <rect x="620" y="140" width="350" height="330" rx="6" fill="rgba(42,35,32,0.03)" stroke="rgba(42,35,32,0.12)" stroke-width="1"/>
  <text x="640" y="166" fill="#2A2320" font-size="10.5" font-weight="600" font-family="'Geist',sans-serif">应用刻意不做</text>
  <g font-family="'Geist',sans-serif" font-size="9" fill="#6F6357">
    <text x="640" y="190">不读关联文件正文，不扫描目录</text>
    <text x="640" y="210">不跟踪源文件内容</text>
    <text x="640" y="230">不持有文件正文或提取缓存</text>
    <text x="640" y="250">不执行导入文本里的命令</text>
    <text x="640" y="270">不自动访问引用以验证存在</text>
  </g>
  <line x1="640" y1="292" x2="950" y2="292" stroke="rgba(42,35,32,0.12)" stroke-width="0.8"/>
  <text x="640" y="316" fill="#2A2320" font-size="10.5" font-weight="600" font-family="'Geist',sans-serif">文件引用只存定位</text>
  <g font-family="'Geist',sans-serif" font-size="9" fill="#6F6357">
    <text x="640" y="340">标题 / 路径 / URL / 来源定位，不含正文</text>
    <text x="640" y="360">用户主动打开；打开前校验允许的路径与协议</text>
    <text x="640" y="380">拒绝可执行文件与危险协议</text>
  </g>
  <line x1="640" y1="402" x2="950" y2="402" stroke="rgba(42,35,32,0.12)" stroke-width="0.8"/>
  <text x="640" y="426" fill="#2A2320" font-size="10.5" font-weight="600" font-family="'Geist',sans-serif">授权在外部工具里给</text>
  <g font-family="'Geist',sans-serif" font-size="9" fill="#6F6357">
    <text x="640" y="450">配套 skill 不替代授权、不保证自动脱敏</text>
  </g>

  <!-- ===== 主链连线（先画） ===== -->
  <path d="M 320 112 V 156" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#aib-arrow)"/>
  <path d="M 320 236 V 280" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#aib-arrow)"/>
  <path d="M 320 348 V 392" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#aib-arrow)"/>
  <path d="M 320 472 V 516" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#aib-arrow)"/>
  <path d="M 320 596 V 640" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#aib-arrow)"/>
  <path d="M 320 720 V 764" fill="none" stroke="#D9603A" stroke-width="1.2" marker-end="url(#aib-arrow-accent)"/>

  <!-- ===== 连线标签 ===== -->
  <g font-family="'Geist Mono',monospace" font-size="8.5" fill="#6F6357">
    <rect x="328" y="128" width="76" height="12" rx="2" fill="#FBF9F6"/>
    <text x="332" y="137">用户交给外部工具</text>
    <rect x="328" y="252" width="84" height="12" rx="2" fill="#FBF9F6"/>
    <text x="332" y="261">输出 JSON 批次</text>
    <rect x="328" y="364" width="94" height="12" rx="2" fill="#FBF9F6"/>
    <text x="332" y="373">schema_version = 1</text>
    <rect x="328" y="488" width="76" height="12" rx="2" fill="#FBF9F6"/>
    <text x="332" y="497">未采纳条目不落库</text>
    <rect x="328" y="612" width="60" height="12" rx="2" fill="#FBF9F6"/>
    <text x="332" y="621">用户本次选择</text>
    <rect x="328" y="736" width="60" height="12" rx="2" fill="#FBF9F6"/>
    <text x="332" y="745" fill="#D9603A">确认后才发送</text>
  </g>

  <!-- ===== 主链 ===== -->
  <rect x="60" y="44" width="520" height="68" rx="6" fill="#FBF9F6"/>
  <rect x="60" y="44" width="520" height="68" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="320" y="72" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">源文件</text>
  <text x="320" y="92" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">PDF · 图片 · 日志 · 网表 · 代码</text>

  <rect x="60" y="156" width="520" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="60" y="156" width="520" height="80" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="320" y="186" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">外部 Agent + 配套 skill</text>
  <text x="320" y="206" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">读文件 · OCR · 正文分析与搜索</text>
  <text x="320" y="222" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">应用不做这些；授权范围由用户在外部工具里管理</text>

  <rect x="60" y="280" width="520" height="68" rx="6" fill="#FBF9F6"/>
  <rect x="60" y="280" width="520" height="68" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="320" y="308" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">JSON 批次</text>
  <text x="320" y="328" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">items 含 item_id · kind · content · sources</text>

  <rect x="60" y="392" width="520" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="60" y="392" width="520" height="80" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="320" y="422" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">导入事务</text>
  <text x="320" y="442" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">本地验证 · 预览来源与冲突 · 逐项采纳 · 去重</text>
  <text x="320" y="458" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">任一失败整体回滚</text>

  <rect x="60" y="516" width="520" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="60" y="516" width="520" height="80" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="320" y="546" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">应用记录</text>
  <text x="320" y="566" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">任务 · 简要事实 / 决策 · 引用（仅标题 / 路径 / URL）</text>
  <text x="320" y="582" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">不存正文、OCR 与提取缓存</text>

  <rect x="60" y="640" width="520" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="60" y="640" width="520" height="80" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="320" y="670" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">预览实际输入 + 确认目的地</text>
  <text x="320" y="690" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">AI 默认关闭；每次选择记录后才组包</text>
  <text x="320" y="706" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">输入版本或提供商 / 端点改变须重新确认</text>

  <rect x="60" y="764" width="520" height="68" rx="6" fill="#FBF9F6"/>
  <rect x="60" y="764" width="520" height="68" rx="6" fill="rgba(42,35,32,0.04)" stroke="#6F6357" stroke-width="1"/>
  <text x="320" y="792" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M10 → 云 AI 提供商</text>
  <text x="320" y="812" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">导入不等于允许发送；撤销只挡尚未发出的请求</text>

  <!-- ===== 注记 ===== -->
  <text x="40" y="864" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    配套 skill 是未来交付物：本轮只定义它的输出协议，尚未创建或安装；导入信息可能敏感，采纳不代表同意外发。</text>
  <text x="40" y="884" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    旧的四级文件密级、权限继承与提取缓存已取消，本图代替它；完整导入契约见 07。</text>
  <text x="40" y="904" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    没有配置模型时全部核心能力可用——捕获、计时、修正、恢复、统计与导出都不经过 AI。</text>

  <!-- ===== 图例（底部横条） ===== -->
  <line x1="30" y1="934" x2="970" y2="934" stroke="rgba(42,35,32,0.14)" stroke-width="0.8"/>
  <text x="30" y="954" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">LEGEND</text>
  <rect x="110" y="945" width="16" height="10" rx="2" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="132" y="954" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">数据流的一步</text>
  <rect x="290" y="945" width="16" height="10" rx="2" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="312" y="954" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">焦点：全图唯一的人工闸门</text>
  <rect x="540" y="945" width="16" height="10" rx="2" fill="rgba(42,35,32,0.04)" stroke="#6F6357" stroke-width="1"/>
  <text x="562" y="954" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">出本机之后</text>
  <rect x="700" y="945" width="16" height="10" rx="2" fill="rgba(42,35,32,0.03)" stroke="rgba(42,35,32,0.12)" stroke-width="1"/>
  <text x="722" y="954" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">边界说明，不是流程节点</text>
</svg>
