<svg viewBox="0 0 1000 930" role="img" aria-labelledby="rev-sync-title rev-sync-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="rev-sync-title">Worktrace revision 同步协议：窗口靠 revision 收敛到服务端真值</title>
  <desc id="rev-sync-desc">时序图，时间自上而下，五条生命线依次为窗口 JS 上下文、domainState 订阅入口、Rust 服务、app_meta.revision、事件广播。窗口先 subscribe 注册监听并把通知暂存不立即应用，再 get_snapshot 拉取带 revision 的一致快照；Rust 在同一读事务内取 revision，并把快照与 revision 一起返回（珊瑚色关键返回）。窗口应用快照后丢弃 revision &lt;= 快照值的通知，之后的 domain.changed 只让受影响查询失效。成功业务写事务使 app_meta.revision 加 1 并持久化；同一事务的多项变化合并为一条 domain.changed 失效通知，附变化实体 ID 与类别，按 revision 顺序经事件广播下发；查询响应带 revision，比该视图已应用或所需版本旧的响应不得覆盖。timer.tick 走独立通道，自带 run_id、tick_seq、as_of、session_id、active_ms、remaining_ms，不触发业务 revision 写入。窗口重显或 IPC 重连时用 get_revision 轻量校验，可见窗口最多每 30 秒一次，不拉全库；下方 opt 片段表示跳号或乱序且缓存无法证明一致时重新取快照。</desc>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap');</style>
    <marker id="rev-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B9BC7"/>
    </marker>
    <marker id="rev-arrow-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6FAFA8"/>
    </marker>
    <marker id="rev-arrow-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D9603A"/>
    </marker>
    <marker id="rev-open-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#8E74B5" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FBF9F6"/>

  <!-- ===== 组合片段 opt（先画，z 序最底） ===== -->
  <rect x="118" y="700" width="404" height="82" rx="4" fill="rgba(42,35,32,0.03)"
        stroke="rgba(42,35,32,0.22)" stroke-width="1"/>
  <rect x="118" y="700" width="44" height="16" rx="2" fill="#F1EDE7"
        stroke="rgba(42,35,32,0.22)" stroke-width="1"/>
  <text x="140" y="712" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        text-anchor="middle" letter-spacing="0.12em">OPT</text>
  <text x="130" y="722" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace">[跳号 / 乱序且缓存无法证明一致]</text>

  <!-- ===== 生命线 ===== -->
  <line x1="130" y1="150" x2="130" y2="800" stroke="rgba(42,35,32,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="150" x2="320" y2="800" stroke="rgba(42,35,32,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="510" y1="150" x2="510" y2="800" stroke="rgba(42,35,32,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="700" y1="150" x2="700" y2="800" stroke="rgba(42,35,32,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="890" y1="150" x2="890" y2="800" stroke="rgba(42,35,32,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== 消息（先于方框与标签） ===== -->
  <!-- ① 首帧对齐 -->
  <path d="M 134 200 H 320" fill="none" stroke="#6B9BC7" stroke-width="1" marker-end="url(#rev-arrow-blue)"/>
  <path d="M 134 244 H 506" fill="none" stroke="#6B9BC7" stroke-width="1" marker-end="url(#rev-arrow-blue)"/>
  <path d="M 514 288 H 700" fill="none" stroke="#6FAFA8" stroke-width="1" marker-end="url(#rev-arrow-teal)"/>
  <path d="M 506 332 H 134" fill="none" stroke="#D9603A" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rev-arrow-coral)"/>
  <path d="M 134 376 H 320" fill="none" stroke="#6B9BC7" stroke-width="1" marker-end="url(#rev-arrow-blue)"/>
  <!-- 写事务与广播 -->
  <path d="M 514 442 H 700" fill="none" stroke="#6FAFA8" stroke-width="1" marker-end="url(#rev-arrow-teal)"/>
  <path d="M 514 486 H 890" fill="none" stroke="#8E74B5" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#rev-open-purple)"/>
  <path d="M 890 530 H 324" fill="none" stroke="#8E74B5" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#rev-open-purple)"/>
  <path d="M 324 574 H 510" fill="none" stroke="#6B9BC7" stroke-width="1" marker-end="url(#rev-arrow-blue)"/>
  <path d="M 890 618 H 130" fill="none" stroke="#8E74B5" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#rev-open-purple)"/>
  <!-- 校验与补救 -->
  <path d="M 130 684 H 510" fill="none" stroke="#6B9BC7" stroke-width="1" marker-end="url(#rev-arrow-blue)"/>
  <path d="M 130 764 H 510" fill="none" stroke="#6B9BC7" stroke-width="1" marker-end="url(#rev-arrow-blue)"/>

  <!-- ===== 激活条（在生命线之上、标签之下） ===== -->
  <rect x="126" y="190" width="8" height="196" fill="rgba(107,155,199,0.16)" stroke="#6B9BC7" stroke-width="0.8"/>
  <rect x="506" y="232" width="8" height="112" fill="rgba(111,175,168,0.18)" stroke="#6FAFA8" stroke-width="0.8"/>
  <rect x="506" y="430" width="8" height="68" fill="rgba(111,175,168,0.18)" stroke="#6FAFA8" stroke-width="0.8"/>
  <rect x="316" y="514" width="8" height="72" fill="rgba(168,196,220,0.20)" stroke="#A8C4DC" stroke-width="0.8"/>

  <!-- ===== 消息标签：先垫纸色遮罩，距所标线 9px ===== -->
  <g font-family="'Geist Mono',monospace" font-size="8.5" fill="#6F6357" text-anchor="middle">
    <!-- ① subscribe -->
    <rect x="170" y="167" width="110" height="24" rx="2" fill="#FBF9F6"/>
    <text x="225" y="177">① subscribe：注册监听</text>
    <text x="225" y="188">并暂存通知，不立即应用</text>

    <!-- ② get_snapshot -->
    <rect x="155" y="211" width="140" height="24" rx="2" fill="#FBF9F6"/>
    <text x="225" y="221">get_snapshot：拉取快照</text>
    <text x="225" y="232">带 revision；数据同一读事务</text>

    <!-- 同一读事务内取 revision -->
    <rect x="543" y="255" width="124" height="24" rx="2" fill="#FBF9F6"/>
    <text x="605" y="265">同一读事务内取</text>
    <text x="605" y="276">revision（随快照返回）</text>

    <!-- 关键返回（珊瑚色） -->
    <rect x="339" y="311" width="152" height="12" rx="2" fill="#FBF9F6"/>
    <text x="415" y="320" fill="#D9603A">快照 + epoch/revision（数据同源）</text>

    <!-- 应用快照 -->
    <rect x="163" y="343" width="125" height="24" rx="2" fill="#FBF9F6"/>
    <text x="225" y="353">② 应用快照；丢弃</text>
    <text x="225" y="364">&lt;= 快照值 的暂存通知</text>

    <!-- 写事务 +1 -->
    <rect x="535" y="409" width="140" height="24" rx="2" fill="#FBF9F6"/>
    <text x="605" y="419">成功业务写事务 revision +1</text>
    <text x="605" y="430">并持久化；无业务变化不加</text>

    <!-- domain.changed 广播 -->
    <rect x="720" y="453" width="150" height="24" rx="2" fill="#FBF9F6"/>
    <text x="795" y="463">domain.changed（事务提交后）</text>
    <text x="795" y="474">合并为一条；附变化实体 ID/类别</text>

    <!-- domain.changed 送达 -->
    <rect x="535" y="497" width="140" height="24" rx="2" fill="#FBF9F6"/>
    <text x="605" y="507">domain.changed</text>
    <text x="605" y="518">（延迟 / 重复 / 乱序都可能）</text>

    <!-- 查询重拉 -->
    <rect x="335" y="541" width="160" height="24" rx="2" fill="#FBF9F6"/>
    <text x="415" y="551">③ 受影响查询失效后重新拉取</text>
    <text x="415" y="562">响应带 epoch/revision；过滤旧回复</text>

    <!-- timer.tick -->
    <rect x="163" y="585" width="124" height="24" rx="2" fill="#FBF9F6"/>
    <text x="225" y="595">timer.tick（独立通道）</text>
    <text x="225" y="606">不触发业务 revision 写入</text>

    <!-- get_revision 校验 -->
    <rect x="339" y="651" width="152" height="24" rx="2" fill="#FBF9F6"/>
    <text x="415" y="661">④ get_revision 轻量校验</text>
    <text x="415" y="672">重显 / IPC 重连时；最多每 30 秒</text>

    <!-- opt：重新取快照 -->
    <rect x="341" y="731" width="148" height="24" rx="2" fill="#FBF9F6"/>
    <text x="415" y="741">⑤ 重新取快照</text>
    <text x="415" y="752">允许短暂延迟，不依赖通知永不丢失</text>
  </g>

  <!-- ===== 段落题（左侧留白，不压生命线） ===== -->
  <g font-family="'Geist Mono',monospace" font-size="8" fill="#6F6357">
    <text x="30" y="200">ALIGN · 首帧对齐</text>
    <text x="30" y="442">WRITE · 写事务与广播</text>
    <text x="30" y="684">VERIFY · 校验与补救</text>
  </g>

  <!-- ===== 参与者（方框后画，各垫纸色底） ===== -->
  <rect x="50" y="96" width="160" height="54" rx="6" fill="#FBF9F6"/>
  <rect x="50" y="96" width="160" height="54" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
  <text x="130" y="120" fill="#2A2320" font-size="12" font-weight="600" font-family="'Geist',sans-serif"
        text-anchor="middle">窗口 JS 上下文</text>
  <text x="130" y="137" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        text-anchor="middle">WINDOW · 独立 JS 上下文</text>

  <rect x="240" y="96" width="160" height="54" rx="6" fill="#FBF9F6"/>
  <rect x="240" y="96" width="160" height="54" rx="6" fill="#EDF3F9" stroke="#A8C4DC" stroke-width="1"/>
  <text x="320" y="120" fill="#2A2320" font-size="12" font-weight="600" font-family="'Geist',sans-serif"
        text-anchor="middle">domainState 订阅入口</text>
  <text x="320" y="137" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        text-anchor="middle">SUBSCRIBE · 唯一订阅入口</text>

  <rect x="430" y="96" width="160" height="54" rx="6" fill="#FBF9F6"/>
  <rect x="430" y="96" width="160" height="54" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="510" y="120" fill="#2A2320" font-size="12" font-weight="600" font-family="'Geist',sans-serif"
        text-anchor="middle">Rust 服务</text>
  <text x="510" y="137" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        text-anchor="middle">RUST · 业务状态唯一权威</text>

  <rect x="620" y="96" width="160" height="54" rx="6" fill="#FBF9F6"/>
  <rect x="620" y="96" width="160" height="54" rx="6" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
  <text x="700" y="120" fill="#2A2320" font-size="12" font-weight="600" font-family="'Geist',sans-serif"
        text-anchor="middle">epoch / revision</text>
  <text x="700" y="137" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        text-anchor="middle">STORAGE · 业务写事务 +1</text>

  <rect x="810" y="96" width="160" height="54" rx="6" fill="#FBF9F6"/>
  <rect x="810" y="96" width="160" height="54" rx="6" fill="#EFE8F6" stroke="#8E74B5" stroke-width="1"
        stroke-dasharray="4,3"/>
  <text x="890" y="120" fill="#2A2320" font-size="12" font-weight="600" font-family="'Geist',sans-serif"
        text-anchor="middle">事件广播</text>
  <text x="890" y="137" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        text-anchor="middle">EVENTS · 事件信封</text>

  <!-- ===== 注记 ===== -->
  <text x="40" y="810" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    app_meta.revision 随成功业务写事务加 1 并持久化；无业务变化不加，心跳和 timer.tick 不加；同事务多项变化合并为一条 domain.changed（附变化实体 ID/类别），按 revision 顺序广播。</text>
  <text x="40" y="828" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    tick 带 epoch、run_id、session_id、session_version、tick_seq、as_of 与计时值；旧代次、旧状态版本或旧序号丢弃。</text>
  <text x="40" y="846" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    响应带 epoch/revision；跨 epoch 先握手并清缓存，同代次过滤旧 revision；可见窗口每 ≤30 秒校验。</text>
  <text x="40" y="864" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    跳号 / 乱序且缓存无法证明一致时重新取快照；允许短暂延迟，不依赖通知永不丢失。方框色相 = 功能归属，深浅 = 作用程度。</text>

  <!-- ===== 图例（底部横条） ===== -->
  <line x1="30" y1="888" x2="970" y2="888" stroke="rgba(42,35,32,0.14)" stroke-width="0.8"/>
  <text x="30" y="906" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">LEGEND</text>
  <line x1="110" y1="902" x2="134" y2="902" stroke="#6B9BC7" stroke-width="1" marker-end="url(#rev-arrow-blue)"/>
  <text x="142" y="906" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">同步调用（等返回）</text>
  <line x1="250" y1="902" x2="274" y2="902" stroke="#6B9BC7" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#rev-arrow-blue)"/>
  <text x="282" y="906" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">返回（虚线实心箭头）</text>
  <line x1="400" y1="902" x2="424" y2="902" stroke="#8E74B5" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#rev-open-purple)"/>
  <text x="432" y="906" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">异步通知（空心箭头）</text>
  <line x1="560" y1="902" x2="584" y2="902" stroke="#D9603A" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rev-arrow-coral)"/>
  <text x="592" y="906" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">关键返回：快照 + epoch/revision</text>
  <rect x="750" y="895" width="8" height="14" fill="rgba(107,155,199,0.16)" stroke="#6B9BC7" stroke-width="0.8"/>
  <text x="766" y="906" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">激活期</text>
  <rect x="815" y="895" width="24" height="14" rx="2" fill="rgba(42,35,32,0.03)" stroke="rgba(42,35,32,0.22)" stroke-width="1"/>
  <text x="847" y="906" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">补救分支（opt）</text>
</svg>
