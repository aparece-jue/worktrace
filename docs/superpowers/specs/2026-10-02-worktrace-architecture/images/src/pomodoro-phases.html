<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Worktrace 番茄钟阶段</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF9F6;--ink:#2A2320;--muted:#6F6357;--accent:#D9603A;--rule:rgba(42,35,32,0.14);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:'Geist','Noto Sans TC',system-ui,sans-serif;
       display:flex;justify-content:center;padding:3rem 1.5rem}
  figure{margin:0;max-width:1000px;width:100%}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;
           text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
  h1{font-family:'Instrument Serif','Noto Serif TC',serif;font-weight:400;
     font-size:1.75rem;margin:0 0 .35rem}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 1.75rem}
  svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<figure>
  <p class="eyebrow">实施契约 · 番茄钟阶段 · 08 §2</p>
  <h1>番茄钟阶段</h1>
  <p class="sub">休息是一个阶段，不是一个会话状态：它跑在 paused 的 session 里，没有工作区间，也不计人工工时。</p>

<svg viewBox="0 0 1000 680" role="img" aria-labelledby="pomo-title pomo-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="pomo-title">Worktrace 番茄钟的阶段与切换规则</title>
  <desc id="pomo-desc">本图仅示常见路径，完整允许条件见 08 §7 命令表。四个阶段排成两列两行。左列是工作阶段：running 时 session 为 running 且有开放工作区间，走 pause 与 resume 在两个阶段之间往返，与 V0.1 的会话规则一致；右列是休息阶段：running 时 session 保持 paused、没有开放工作区间，只运行独立的阶段计时，暂停、锁屏、休眠或重启后转为冻结。四条跨阶段与同阶段的边：工作 running 经「显式开始休息」闭合工作区间并切到休息；休息经「显式开始下一轮」重新检查前台占用并切回工作，占用冲突则保持休息；休息 running 经暂停或锁屏休眠转为冻结；冻结经显式继续回到休息 running，这一步不等于 resume 工作。工作到点与休息到点都只提示、不自动切换，用一条注记表达而不是从每个状态各画一条边；完成或取消任务会结束所有阶段。</desc>

  <defs>
    <marker id="pm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FBF9F6"/>

  <!-- ===== 列标题 ===== -->
  <text x="270" y="58" fill="#2A2320" font-size="10.5" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">工作阶段 · 沿用会话的 running / paused</text>
  <text x="730" y="58" fill="#2A2320" font-size="10.5" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">休息阶段 · session 保持 paused</text>

  <!-- ===== 连线（先画） ===== -->
  <path d="M 270 228 V 300" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#pm-arrow)"/>
  <path d="M 100 344 H 52 Q 44 344 44 336 V 192 Q 44 184 52 184 H 100"
        fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#pm-arrow)"/>
  <path d="M 440 184 H 560" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#pm-arrow)"/>
  <path d="M 730 140 V 98 Q 730 90 722 90 H 278 Q 270 90 270 98 V 140"
        fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#pm-arrow)"/>
  <path d="M 730 228 V 300" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#pm-arrow)"/>
  <path d="M 900 344 H 952 Q 960 344 960 336 V 192 Q 960 184 952 184 H 900"
        fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#pm-arrow)"/>

  <!-- ===== 标签（遮罩在方框之前，且不压任何方框） ===== -->
  <g font-family="'Geist Mono',monospace" font-size="8.5" text-anchor="middle" fill="#6F6357">
    <rect x="278" y="258" width="34" height="12" rx="2" fill="#FBF9F6"/>
    <text x="295" y="267">pause</text>
    <rect x="52" y="258" width="42" height="12" rx="2" fill="#FBF9F6"/>
    <text x="73" y="267">resume</text>
    <rect x="474" y="163" width="52" height="12" rx="2" fill="#FBF9F6"/>
    <text x="500" y="172">显式开始休息</text>
    <rect x="470" y="69" width="60" height="12" rx="2" fill="#FBF9F6"/>
    <text x="500" y="78">显式开始下一轮</text>
    <rect x="738" y="258" width="84" height="12" rx="2" fill="#FBF9F6"/>
    <text x="780" y="267">暂停 / 锁屏 / 休眠</text>
    <rect x="908" y="258" width="42" height="12" rx="2" fill="#FBF9F6"/>
    <text x="929" y="267">显式继续</text>
  </g>

  <!-- ===== 四个阶段 ===== -->
  <rect x="100" y="140" width="340" height="88" rx="6" fill="#FBF9F6"/>
  <rect x="100" y="140" width="340" height="88" rx="6" fill="#CFE6E2" stroke="#4E8C85" stroke-width="1"/>
  <text x="270" y="170" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">工作 · running（计时中）</text>
  <text x="270" y="190" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">session running，有开放 work_interval</text>
  <text x="270" y="208" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">到点只提示，仍记实际工作与超时</text>

  <rect x="100" y="300" width="340" height="88" rx="6" fill="#FBF9F6"/>
  <rect x="100" y="300" width="340" height="88" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="270" y="330" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">工作 · frozen（已暂停）</text>
  <text x="270" y="350" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">session paused，无开放区间，值冻结</text>
  <text x="270" y="368" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">暂停冻结的是当前阶段</text>

  <rect x="560" y="140" width="340" height="88" rx="6" fill="#FBF9F6"/>
  <rect x="560" y="140" width="340" height="88" rx="6" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
  <text x="730" y="170" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">休息 · running（计时中）</text>
  <text x="730" y="190" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">无开放 work_interval，只跑阶段计时</text>
  <text x="730" y="208" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">不占前台槽位，不计入人工工时</text>

  <rect x="560" y="300" width="340" height="88" rx="6" fill="#FBF9F6"/>
  <rect x="560" y="300" width="340" height="88" rx="6" fill="#FBF1DC" stroke="#CBA758" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="730" y="330" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">休息 · frozen（已冻结）</text>
  <text x="730" y="350" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">暂停 / 锁屏 / 休眠 / 重启后</text>
  <text x="730" y="368" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">按持久检查点恢复为冻结，不补停机时间</text>

  <!-- ===== 到点行为：一条注记代替从每个状态各画一条边 ===== -->
  <rect x="100" y="424" width="800" height="40" rx="6" fill="#FBF9F6"/>
  <rect x="100" y="424" width="800" height="40" rx="6" fill="rgba(42,35,32,0.04)" stroke="#6F6357" stroke-width="1"/>
  <text x="500" y="449" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif"
        text-anchor="middle">常见路径示意，完整命令见 08 §7；到点只提示，合法完成 / 取消后清除活动阶段</text>

  <!-- ===== 阶段元数据 ===== -->
  <rect x="100" y="488" width="800" height="104" rx="6" fill="rgba(42,35,32,0.03)" stroke="rgba(42,35,32,0.12)" stroke-width="1"/>
  <text x="120" y="512" fill="#2A2320" font-size="10.5" font-weight="600" font-family="'Geist',sans-serif">阶段元数据（timer_kind = pomodoro 时额外保存）</text>
  <g font-family="'Geist Mono',monospace" font-size="8.5" fill="#6F6357">
    <text x="120" y="536">phase · phase_state（running / frozen）· cycle_index · session_version</text>
    <text x="120" y="556">work_budget_ms · break_budget_ms　（工作段预算与整次 session 工时分别显示）</text>
    <text x="120" y="576">phase_checkpoint 挂 session，约每 30 秒保存 phase_elapsed_ms</text>
  </g>

  <!-- ===== 注记 ===== -->
  <text x="40" y="620" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    休息不能替代 resume：回到工作必须经「显式开始下一轮」，届时重新检查前台占用，冲突则留在休息 / 暂停。</text>
  <text x="40" y="640" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    完整命令条件见 08 §7；预算按阶段计算，锁屏 / 休眠冻结，醒来显式继续，不补离开时间。</text>

  <!-- ===== 图例（底部横条） ===== -->
  <line x1="30" y1="654" x2="970" y2="654" stroke="rgba(42,35,32,0.14)" stroke-width="0.8"/>
  <text x="30" y="674" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="665" width="16" height="10" rx="2" fill="#CFE6E2" stroke="#4E8C85" stroke-width="1"/>
  <text x="142" y="674" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">work / running</text>
  <rect x="270" y="665" width="16" height="10" rx="2" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="292" y="674" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">work / frozen</text>
  <rect x="430" y="665" width="16" height="10" rx="2" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
  <text x="452" y="674" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">break / running</text>
  <rect x="590" y="665" width="16" height="10" rx="2" fill="#FBF1DC" stroke="#CBA758" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="612" y="674" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">break / frozen</text>
  <rect x="750" y="665" width="16" height="10" rx="2" fill="rgba(42,35,32,0.04)" stroke="#6F6357" stroke-width="1"/>
  <text x="772" y="674" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">到点行为与终止规则</text>
</svg>
</figure>
</body>
</html>
