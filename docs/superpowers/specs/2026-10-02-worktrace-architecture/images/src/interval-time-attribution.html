<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Worktrace 区间时长与时间归属</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF9F6;--ink:#2A2320;--muted:#6F6357;--accent:#D9603A;--rule:rgba(42,35,32,0.14);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:'Geist','Noto Sans TC',system-ui,sans-serif;
       display:flex;justify-content:center;padding:3rem 1.5rem}
  figure{margin:0;max-width:1000px;width:100%}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;
           text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
  h1{font-family:'Instrument Serif','Noto Serif TC',serif;font-weight:400;
     font-size:1.75rem;margin:0 0 .35rem}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 1.75rem}
  svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<figure>
  <p class="eyebrow">实施契约 · 时间归属 · 08 §1</p>
  <h1>区间时长与时间归属</h1>
  <p class="sub">三种时间各管一件事：墙钟负责归属，单调负责时长，两者之差负责发现「这段时间不可信」。</p>

<svg viewBox="0 0 1000 810" role="img" aria-labelledby="ita-title ita-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ita-title">Worktrace 工作区间的三种时间与异常分割</title>
  <desc id="ita-desc">上半是正常关闭：开始采样墙钟 W0 与单调 M0，期间约每 30 秒同事务写一个检查点，关闭时用单调差得 duration_ms，统计的 ended_at 等于 started_at 加 duration_ms，可信闭合区间满足 duration_ms 等于 ended_at 减 started_at；原始墙钟关闭值只作诊断，不拿来直接减开始时间。下半是异常：每次采样比较相邻增量差与墙钟相对可信归属基线的累计偏差，差值绝对值超过 2000 毫秒、倒退、休眠或时钟变更、采样失效都走异常路径。异常时只保留到最后一个可信检查点的闭合前缀并照常计入，其后余段标 needs_review 且不计入，记录原始墙钟与候选单调增量，不按错误墙钟补时间；没有可信检查点则整个当前区间待确认。底部两块说明三种时间的分工与检查点持久化的字段。</desc><defs></defs>

  <rect width="100%" height="100%" fill="#FBF9F6"/>

  <!-- ================= 上半：正常关闭 ================= -->
  <text x="40" y="58" fill="#2A2320" font-size="11" font-weight="600" font-family="'Geist',sans-serif">正常关闭</text>
  <text x="118" y="58" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">同一可信 run 连续归属；检查相邻增量差及累计偏差，心跳不重置基线</text>

  <line x1="120" y1="120" x2="900" y2="120" stroke="#6F6357" stroke-width="1"/>
  <circle cx="170" cy="120" r="5" fill="#2A2320"/>
  <text x="120" y="102" fill="#2A2320" font-size="9" font-family="'Geist',sans-serif">开始：采样 W0 / M0</text>
  <circle cx="310" cy="120" r="3.5" fill="#6F6357"/>
  <circle cx="420" cy="120" r="3.5" fill="#6F6357"/>
  <circle cx="530" cy="120" r="3.5" fill="#6F6357"/>
  <circle cx="640" cy="120" r="3.5" fill="#6F6357"/>
  <circle cx="750" cy="120" r="3.5" fill="#6F6357"/>
  <text x="420" y="142" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace">检查点：约每 30 秒同事务持久化</text>
  <circle cx="860" cy="120" r="5" fill="#2A2320"/>
  <text x="900" y="102" fill="#2A2320" font-size="9" font-family="'Geist',sans-serif" text-anchor="end">关闭：W1 / M1</text>

  <rect x="120" y="164" width="780" height="64" rx="6" fill="#FBF9F6"/>
  <rect x="120" y="164" width="780" height="64" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="510" y="188" fill="#2A2320" font-size="11" font-weight="600"
        font-family="'Geist Mono',monospace" text-anchor="middle">duration_ms = M1 − M0</text>
  <text x="510" y="208" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">统计 ended_at = started_at + duration_ms；可信闭合时 duration_ms = ended_at − started_at</text>

  <!-- ================= 下半：异常 ================= -->
  <text x="40" y="270" fill="#2A2320" font-size="11" font-weight="600" font-family="'Geist',sans-serif">异常</text>
  <text x="78" y="270" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">相邻增量差或累计偏差 &gt; 2000ms，或倒退、休眠、时钟变更、采样失效</text>

  <line x1="120" y1="330" x2="900" y2="330" stroke="rgba(42,35,32,0.18)" stroke-width="1"/>
  <circle cx="170" cy="330" r="5" fill="#2A2320"/>
  <text x="120" y="312" fill="#2A2320" font-size="9" font-family="'Geist',sans-serif">开始：W0 / M0</text>
  <circle cx="310" cy="330" r="3.5" fill="#6F6357"/>
  <circle cx="420" cy="330" r="3.5" fill="#6F6357"/>
  <!-- 可信前缀：加粗实线，照常计入 -->
  <line x1="170" y1="330" x2="530" y2="330" stroke="#4E8C85" stroke-width="3"/>
  <!-- 最后一个可信检查点 -->
  <circle cx="530" cy="330" r="5.5" fill="#D9603A"/>
  <text x="530" y="312" fill="#D9603A" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">最后可信检查点</text>
  <!-- 异常点 -->
  <line x1="640" y1="318" x2="640" y2="342" stroke="#D9603A" stroke-width="1.6"/>
  <text x="640" y="312" fill="#D9603A" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">异常点</text>
  <!-- 待确认余段：从最后一个可信检查点之后就开始，不是从异常点才开始 -->
  <line x1="538" y1="330" x2="900" y2="330" stroke="#D9603A" stroke-width="2" stroke-dasharray="6,4"/>

  <text x="350" y="358" fill="#4E8C85" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">可信前缀：闭合、照常计入</text>
  <text x="770" y="358" fill="#D9603A" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">余段：needs_review、不计入</text>

  <rect x="120" y="382" width="380" height="72" rx="6" fill="#FBF9F6"/>
  <rect x="120" y="382" width="380" height="72" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="310" y="406" fill="#2A2320" font-size="11" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">保留到最后一个可信检查点</text>
  <text x="310" y="426" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">不因异常被重复计入；恢复或修正一次事务分割并写审计</text>

  <rect x="520" y="382" width="380" height="72" rx="6" fill="#FBF9F6"/>
  <rect x="520" y="382" width="380" height="72" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="710" y="406" fill="#2A2320" font-size="11" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">余段标 needs_review</text>
  <text x="710" y="426" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">记原始墙钟与候选单调增量，不按错误墙钟补时间</text>

  <rect x="120" y="470" width="780" height="44" rx="6" fill="#FBF9F6"/>
  <rect x="120" y="470" width="780" height="44" rx="6" fill="rgba(42,35,32,0.04)" stroke="#6F6357" stroke-width="1"/>
  <text x="510" y="497" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif"
        text-anchor="middle">没有可信检查点 → 整个当前区间待确认；已知且可信的锁屏 / 休眠边界走 pause，通知晚到或边界不可信才走 recovering</text>

  <!-- ================= 两块说明 ================= -->
  <rect x="40" y="544" width="450" height="174" rx="6" fill="rgba(42,35,32,0.03)" stroke="rgba(42,35,32,0.12)" stroke-width="1"/>
  <text x="60" y="568" fill="#2A2320" font-size="10.5" font-weight="600" font-family="'Geist',sans-serif">三种时间，别混用</text>
  <g font-family="'Geist Mono',monospace" font-size="8.5" fill="#6F6357">
    <text x="60" y="592">wall_at　　只用来建基线与诊断，不直接定归属</text>
    <text x="60" y="612">elapsed　　当前 run 的单调增量，跨重启不复用</text>
    <text x="60" y="632">归属基线　A(M) = anchor_wall_at + (M − anchor_monotonic)</text>
    <text x="60" y="652">started_at / ended_at　　统计归属区间，由基线推出</text>
    <text x="60" y="672">duration_ms　　同一事实的校验值，不能独立编辑</text>
  </g>
  <text x="60" y="698" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">阈值内小幅校时不改基线、不重写历史；M06 用同一快照的归属终点，不另取 Date.now()</text>

  <rect x="510" y="544" width="450" height="174" rx="6" fill="rgba(42,35,32,0.03)" stroke="rgba(42,35,32,0.12)" stroke-width="1"/>
  <text x="530" y="568" fill="#2A2320" font-size="10.5" font-weight="600" font-family="'Geist',sans-serif">检查点 interval_checkpoint（约每 30 秒，同事务）</text>
  <g font-family="'Geist Mono',monospace" font-size="8.5" fill="#6F6357">
    <text x="530" y="592">interval_id · run_id</text>
    <text x="530" y="612">wall_at（可信墙钟）· attribution_at（归属终点）</text>
    <text x="530" y="632">elapsed_ms（单调增量）</text>
    <text x="530" y="652">单调 Instant 本身不持久化</text>
  </g>
  <text x="530" y="698" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">写检查点不增加业务 revision，改变区间或状态才增加；写失败不能把内存值当可恢复事实</text>

  <!-- ===== 注记 ===== -->
  <text x="40" y="742" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    手工修正以用户确认的起止重新计算 duration_ms 并保留前后值审计；已知单调时长只作候选，不强迫用户接受。</text>
  <text x="40" y="762" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    2000ms 阈值是初始策略，平台实验后可版本化调整，不是精度承诺；跨日按查询时区实际日界裁剪，不假设每天都 24 小时。</text>

  <!-- ===== 图例（底部横条） ===== -->
  <line x1="30" y1="776" x2="970" y2="776" stroke="rgba(42,35,32,0.14)" stroke-width="0.8"/>
  <text x="30" y="796" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="792" x2="156" y2="792" stroke="#4E8C85" stroke-width="3"/>
  <text x="166" y="796" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">可信前缀（计入）</text>
  <line x1="300" y1="792" x2="336" y2="792" stroke="#D9603A" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="346" y="796" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">待确认余段（不计入）</text>
  <circle cx="520" cy="792" r="5.5" fill="#D9603A"/>
  <text x="534" y="796" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">最后可信检查点</text>
  <circle cx="680" cy="792" r="3.5" fill="#6F6357"/>
  <text x="694" y="796" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">常规检查点</text>
  <rect x="800" y="787" width="16" height="10" rx="2" fill="rgba(42,35,32,0.03)" stroke="rgba(42,35,32,0.12)" stroke-width="1"/>
  <text x="822" y="796" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">说明，不是流程节点</text>
</svg>
</figure>
</body>
</html>
