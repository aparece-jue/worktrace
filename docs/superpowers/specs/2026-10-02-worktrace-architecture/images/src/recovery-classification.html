<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Worktrace 崩溃恢复的四类判定</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF9F6;--ink:#2A2320;--muted:#6F6357;--accent:#D9603A;--rule:rgba(42,35,32,0.14);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:'Geist','Noto Sans TC',system-ui,sans-serif;
       display:flex;justify-content:center;padding:3rem 1.5rem}
  figure{margin:0;max-width:1000px;width:100%}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;
           text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
  h1{font-family:'Instrument Serif','Noto Serif TC',serif;font-weight:400;
     font-size:1.75rem;margin:0 0 .35rem}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 1.75rem}
  svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<figure>
  <p class="eyebrow">数据模型 · 启动扫描 · §4</p>
  <h1>崩溃恢复的四类判定</h1>
  <p class="sub">启动扫描不是「旧记录一律作废」：先看不变量是否可信，再决定是保留、待确认，还是隔离。</p>

<svg viewBox="0 0 1000 810" role="img" aria-labelledby="rc-title rc-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="rc-title">Worktrace 启动扫描对旧记录的四种判定</title>
  <desc id="rc-desc">启动新 run 后扫描旧 run 未结束的会话与区间，按三步判定分成四种处理。第一步看不变量：状态与区间标记不一致就隔离故障记录、只做诊断、禁止自动修复事实，可疑区间暂不计入并在界面明示。第二步看有没有开放或待确认区间：没有就保持 paused、更新 run_id、不自动继续，已确认闭合区间保持计入。第三步看当前是哪一种：running 的会话设为 recovering 且只把该区间标 needs_review，既有闭合区间计入、开放区间待确认；已经是 recovering 的保持待确认、不增加已知工时。隔离故障是唯一的强调项，因为它是「宁可隔离也不猜」的那条规则。</desc>

  <defs>
    <marker id="rc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FBF9F6"/>

  <!-- ===== 连线（先画） ===== -->
  <path d="M 500 104 V 132" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#rc-arrow)"/>
  <path d="M 660 190 H 760" fill="none" stroke="#D9603A" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
  <path d="M 500 248 V 312" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#rc-arrow)"/>
  <path d="M 340 370 H 260" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#rc-arrow)"/>
  <path d="M 500 428 V 492" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#rc-arrow)"/>
  <path d="M 660 550 H 760" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#rc-arrow)"/>
  <path d="M 340 550 H 260" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#rc-arrow)"/>

  <!-- ===== 判定标签（遮罩在方框之前，且不压任何方框） ===== -->
  <g font-family="'Geist Mono',monospace" font-size="8.5" text-anchor="middle" fill="#6F6357">
    <rect x="696" y="169" width="30" height="12" rx="2" fill="#FBF9F6"/>
    <text x="711" y="178">损坏</text>
    <rect x="508" y="270" width="30" height="12" rx="2" fill="#FBF9F6"/>
    <text x="523" y="279">完好</text>
    <rect x="278" y="349" width="30" height="12" rx="2" fill="#FBF9F6"/>
    <text x="293" y="358">没有</text>
    <rect x="508" y="450" width="30" height="12" rx="2" fill="#FBF9F6"/>
    <text x="523" y="459">有</text>
    <rect x="690" y="529" width="44" height="12" rx="2" fill="#FBF9F6"/>
    <text x="712" y="538">running</text>
    <rect x="268" y="529" width="58" height="12" rx="2" fill="#FBF9F6"/>
    <text x="297" y="538">recovering</text>
  </g>

  <!-- ===== 起点 ===== -->
  <path d="M 340 48 H 660 A 28 28 0 0 1 660 104 H 340 A 28 28 0 0 1 340 48 Z" fill="#FBF9F6"/>
  <path d="M 340 48 H 660 A 28 28 0 0 1 660 104 H 340 A 28 28 0 0 1 340 48 Z"
        fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="500" y="74" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">启动新 run 并扫描</text>
  <text x="500" y="92" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">旧 run 未结束的会话与区间</text>

  <!-- ===== 判定一：不变量 ===== -->
  <path d="M 500 132 L 660 190 L 500 248 L 340 190 Z" fill="#FBF9F6"/>
  <path d="M 500 132 L 660 190 L 500 248 L 340 190 Z" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="500" y="195" fill="#2A2320" font-size="11.5" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">不变量完好？</text>

  <!-- ===== 判定二：有无不确定区间 ===== -->
  <path d="M 500 312 L 660 370 L 500 428 L 340 370 Z" fill="#FBF9F6"/>
  <path d="M 500 312 L 660 370 L 500 428 L 340 370 Z" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="500" y="366" fill="#2A2320" font-size="11.5" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">有开放或</text>
  <text x="500" y="382" fill="#2A2320" font-size="11.5" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">待确认区间？</text>

  <!-- ===== 判定三：哪一种 ===== -->
  <path d="M 500 492 L 660 550 L 500 608 L 340 550 Z" fill="#FBF9F6"/>
  <path d="M 500 492 L 660 550 L 500 608 L 340 550 Z" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="500" y="555" fill="#2A2320" font-size="11.5" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">当前是哪一种？</text>

  <!-- ===== 四类处理 ===== -->
  <rect x="760" y="150" width="220" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="760" y="150" width="220" height="80" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="870" y="180" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">隔离故障记录</text>
  <text x="870" y="200" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">只诊断，禁止自动修复事实</text>
  <text x="870" y="216" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">可疑区间暂不计，界面明示</text>

  <rect x="40" y="330" width="220" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="40" y="330" width="220" height="80" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="150" y="360" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">保持 paused</text>
  <text x="150" y="380" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">更新 run_id；不自动继续</text>
  <text x="150" y="396" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">已确认闭合区间保持计入</text>

  <rect x="760" y="510" width="220" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="760" y="510" width="220" height="80" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="870" y="540" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">设为 recovering</text>
  <text x="870" y="560" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">只将该区间 needs_review = 1</text>
  <text x="870" y="576" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">闭合区间计入，开放区间待确认</text>

  <rect x="40" y="510" width="220" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="40" y="510" width="220" height="80" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="150" y="540" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">保持待确认</text>
  <text x="150" y="560" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">不增加已知工时</text>
  <text x="150" y="576" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">闭合计入，开放待确认</text>

  <!-- ===== 注记 ===== -->
  <text x="40" y="664" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    session.needs_review 在事务内与区间标记保持一致，不能单独修改：running 必须没有待确认区间，recovering 必须有待确认区间或显式的不变量故障标记。</text>
  <text x="40" y="684" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    不用两分钟心跳门槛，因此强杀后立刻重启也会被扫到；心跳约每 30 秒只记最后可信检查点（interval_id、可信墙钟与运行态基线），只提供候选截止时间，不能自动补工时。</text>
  <text x="40" y="704" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    已确认的闭合工时在 recovering 会话里照样计入；被排除的只有 needs_review=1 的区间。丢弃单个区间与作废整次记录是两个不同的动作。</text>

  <!-- ===== 图例（底部横条） ===== -->
  <line x1="30" y1="726" x2="970" y2="726" stroke="rgba(42,35,32,0.14)" stroke-width="0.8"/>
  <text x="30" y="746" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">LEGEND</text>
  <ellipse cx="128" cy="742" rx="18" ry="9" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="156" y="746" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">扫描起点</text>
  <path d="M 270 742 L 288 734 L 306 742 L 288 750 Z" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="318" y="746" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">判定（每个出口都标注）</text>
  <rect x="500" y="737" width="36" height="10" rx="4" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="548" y="746" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">启动后的处理</text>
  <rect x="680" y="737" width="16" height="10" rx="2" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="702" y="746" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">焦点：宁可隔离也不猜</text>
</svg>
</figure>
</body>
</html>
