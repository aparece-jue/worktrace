<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Worktrace 核心模块实现顺序</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF9F6;--ink:#2A2320;--muted:#6F6357;--accent:#D9603A;--rule:rgba(42,35,32,0.14);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:'Geist','Noto Sans TC',system-ui,sans-serif;
       display:flex;justify-content:center;padding:3rem 1.5rem}
  figure{margin:0;max-width:1000px;width:100%}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;
           text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
  h1{font-family:'Instrument Serif','Noto Serif TC',serif;font-weight:400;
     font-size:1.75rem;margin:0 0 .35rem}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 1.75rem}
  svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<figure>
  <p class="eyebrow">模块分解 · 依赖 · V0.1</p>
  <h1>核心模块实现顺序</h1>
  <p class="sub">由下向上推进实现；箭头表示前置能力，不表示直接代码依赖。</p>

<svg viewBox="0 0 1000 720" role="img" aria-labelledby="dep-core-title dep-core-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dep-core-title">Worktrace 核心模块实现顺序</title>
  <desc id="dep-core-desc">由下向上的基础能力实现顺序，不是直接代码依赖图。M04 不直接访问存储；M05 协调计时与持久化。完整代码依赖以模块职责表为准；最小统计 M06 与导出 M07 同属 V0.1。</desc>

  <defs>
    <marker id="dp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
    </marker>
    <marker id="dp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D9603A"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FBF9F6"/>

  <!-- ===== 连线（先画） ===== -->
  <path d="M 500 170 V 126" stroke="#6F6357" stroke-width="1" marker-end="url(#dp-arrow)"/>
  <path d="M 500 270 V 226" stroke="#6F6357" stroke-width="1" marker-end="url(#dp-arrow)"/>
  <path d="M 500 370 V 326" stroke="#6F6357" stroke-width="1" marker-end="url(#dp-arrow)"/>
  <!-- M02 -> M01（焦点：枢纽的主出口）。fill="none" 必须写：SVG 的 fill 初值是黑色，
       开放路径会被隐式闭合，多拐点连线不写就渲染成实心黑块。 -->
  <path d="M 265 470 V 448 Q 265 440 273 440 H 492 Q 500 440 500 432 V 426"
        fill="none" stroke="#D9603A" stroke-width="1" marker-end="url(#dp-arrow-accent)"/>
  <!-- M00 -> M04，走 M00 与 M03 之间的空档上行，不穿过 M03 方框 -->
  <path d="M 585 498 H 609 Q 617 498 617 490 V 306 Q 617 298 609 298 H 585"
        fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#dp-arrow)"/>
  <!-- M03 -> M04，更外侧 -->
  <path d="M 820 490 H 852 Q 860 490 860 482 V 290 Q 860 282 852 282 H 585"
        fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#dp-arrow)"/>
  <!-- M03 -> M02，从下方绕过 M00 -->
  <path d="M 650 526 V 560 Q 650 568 642 568 H 273 Q 265 568 265 560 V 526"
        fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#dp-arrow)"/>

  <!-- ===== Rank 0 ===== -->
  <rect x="415" y="70" width="170" height="56" rx="6" fill="#E3EDF7" stroke="#6B9BC7" stroke-width="1"/>
  <text x="500" y="94" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M12 前端骨架</text>
  <text x="500" y="112" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">经 IPC 调用服务</text>

  <!-- ===== Rank 1 ===== -->
  <rect x="415" y="170" width="170" height="56" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="500" y="194" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M05 会话</text>
  <text x="500" y="212" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">区间 · 暂停恢复 · 修正</text>

  <!-- ===== Rank 2 ===== -->
  <rect x="415" y="270" width="170" height="56" rx="6" fill="#E4F1EF" stroke="#6FAFA8" stroke-width="1"/>
  <text x="500" y="294" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M04 计时</text>
  <text x="500" y="312" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">单调时钟 · 预算倒计时</text>

  <!-- ===== Rank 3 ===== -->
  <rect x="415" y="370" width="170" height="56" rx="6" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>

  <rect x="500" y="376" width="34" height="12" rx="2" fill="transparent" stroke="rgba(203,167,88,0.45)" stroke-width="0.8"/>
  <text x="517" y="385" fill="#9A7B2E" font-size="7" font-family="'Geist Mono',monospace"
        text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="500" y="404" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M01 存储</text>
  <text x="500" y="420" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">迁移 · 事务 · 区间查询</text>

  <!-- ===== Rank 4 ===== -->
  <!-- M02 领域：纯领域基础，焦点 -->
  <rect x="180" y="470" width="170" height="56" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>

  <text x="265" y="500" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M02 领域</text>
  <text x="265" y="518" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">纯类型 · 跃迁 · 校验（无 IO）</text>

  <rect x="415" y="470" width="170" height="56" rx="6" fill="#E8EBF0" stroke="#8A94A3" stroke-width="1"/>

  <text x="500" y="500" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M00 平台</text>
  <text x="500" y="518" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">单实例 · 托盘 · 锁屏</text>

  <rect x="650" y="470" width="170" height="56" rx="6" fill="#EFE8F6" stroke="#8E74B5" stroke-width="1"/>

  <text x="735" y="500" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">M03 事件</text>
  <text x="735" y="518" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">纯事件类型 · revision</text>

  <!-- 注记 -->
  <text x="60" y="600" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    本图为核心基础能力实现顺序；V0.1 还包含 M06 最小统计与 M07 导出。</text>
  <text x="60" y="618" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    M05 协调数据库提交与计时基线；M04 不直接写库。代码依赖见模块职责表。</text>
  <text x="60" y="636" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    关键路径 M02 → M01 → M04 → M05 任一环滑期，下游全部顺延。</text>
  <text x="60" y="654" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    平台与事件为基础接线；实现顺序不等同于编译依赖。</text>

  <!-- 图例 -->
  <line x1="30" y1="676" x2="970" y2="676" stroke="rgba(42,35,32,0.14)" stroke-width="0.8"/>
  <text x="30" y="694" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">LEGEND</text>
  <text x="110" y="694" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace">色相 = 层级（边界 / 服务 / 持久化 / 领域 / 平台 / 横切）</text>
  <rect x="470" y="686" width="16" height="10" rx="2" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="492" y="694" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">纯领域基础（焦点）</text>

</svg>
</figure>
</body>
</html>
