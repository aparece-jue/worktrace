<svg viewBox="0 0 1000 870" role="img" aria-labelledby="clip-split-title clip-split-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="clip-split-title">Worktrace 统计的区间裁剪与人工/机器分离</title>
  <desc id="clip-split-desc">自上而下：查询输入带着半开范围与协调器快照，取出有效区间集合并排除待确认及作废区间、整次 discarded；对每一段区间按公式取与范围的交集，这就是全图唯一的计算规则，也是强调项；裁剪结果按 mode 分成四类并分别汇总——人工只算 FOREGROUND，机器分 BACKGROUND 与 PASSIVE 两项，WAITING 单列，人工与机器之间有一条明确禁止跨越的合并边界；四类测量各自进入报表 DTO，已确认已结束与实时暂计分开标注。</desc>

  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap');</style>
    <marker id="cs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6F6357"/>
    </marker>
    <marker id="cs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D9603A"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FBF9F6"/>

  <!-- ===== 连线（先画） ===== -->
  <path d="M 350 120 H 430" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#cs-arrow)"/>
  <path d="M 560 164 V 250" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#cs-arrow)"/>
  <!-- 逐段裁剪 -> 四类测量：从焦点分出去，四段独立走线，互不重叠 -->
  <path d="M 350 338 V 380 Q 350 388 342 388 H 158 Q 150 388 150 396 V 430"
        fill="none" stroke="#D9603A" stroke-width="1.2" marker-end="url(#cs-arrow-accent)"/>
  <path d="M 390 338 V 430" fill="none" stroke="#D9603A" stroke-width="1.2" marker-end="url(#cs-arrow-accent)"/>
  <path d="M 630 338 V 430" fill="none" stroke="#D9603A" stroke-width="1.2" marker-end="url(#cs-arrow-accent)"/>
  <path d="M 650 338 V 380 Q 650 388 658 388 H 852 Q 860 388 860 396 V 430"
        fill="none" stroke="#D9603A" stroke-width="1.2" marker-end="url(#cs-arrow-accent)"/>
  <!-- 四类测量 -> 报表 DTO -->
  <path d="M 150 510 V 570 Q 150 578 158 578 H 342 Q 350 578 350 586 V 620"
        fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#cs-arrow)"/>
  <path d="M 390 510 V 620" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#cs-arrow)"/>
  <path d="M 630 510 V 620" fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#cs-arrow)"/>
  <path d="M 860 510 V 570 Q 860 578 852 578 H 658 Q 650 578 650 586 V 620"
        fill="none" stroke="#6F6357" stroke-width="1" marker-end="url(#cs-arrow)"/>

  <!-- ===== 禁止跨越的合并边界（不是连线，是约束） ===== -->
  <line x1="270" y1="430" x2="270" y2="510" stroke="#6F6357" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- ===== 标签（遮罩在方框之前，且不压任何方框） ===== -->
  <g font-family="'Geist Mono',monospace" font-size="8.5" text-anchor="middle" fill="#6F6357">
    <rect x="398" y="375" width="100" height="12" rx="2" fill="#FBF9F6"/>
    <text x="448" y="384">按 mode 分别汇总</text>
    <rect x="236" y="409" width="68" height="12" rx="2" fill="#FBF9F6"/>
    <text x="270" y="418" fill="#D9603A">不可相加</text>
  </g>

  <!-- ===== 输入两段 ===== -->
  <rect x="110" y="76" width="240" height="88" rx="6" fill="#FBF9F6"/>
  <rect x="110" y="76" width="240" height="88" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="230" y="114" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">查询输入</text>
  <text x="230" y="134" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">范围 [from, to)　半开</text>
  <text x="230" y="150" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">报表口径随查询一同记录</text>

  <rect x="430" y="76" width="260" height="88" rx="6" fill="#FBF9F6"/>
  <rect x="430" y="76" width="260" height="88" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="560" y="114" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">有效区间集合</text>
  <text x="560" y="134" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">排除待确认 / 作废区间</text>
  <text x="560" y="150" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">已确认已结束 与 实时暂计 分开标注</text>

  <!-- ===== 焦点：唯一的计算规则 ===== -->
  <rect x="310" y="250" width="380" height="88" rx="6" fill="#FBF9F6"/>
  <rect x="310" y="250" width="380" height="88" rx="6" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="500" y="284" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">逐段裁剪到范围</text>
  <text x="500" y="308" fill="#D9603A" font-size="11" font-family="'Geist Mono',monospace"
        text-anchor="middle">max(0, min(end, to) − max(start, from))</text>
  <text x="500" y="328" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">运行区间的 end 用协调器单调归属终点</text>

  <!-- ===== 四类测量 ===== -->
  <rect x="50" y="430" width="200" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="50" y="430" width="200" height="80" rx="6" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
  <text x="150" y="462" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">人工时长</text>
  <text x="150" y="482" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">FOREGROUND</text>
  <text x="150" y="498" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">唯一计进人工的量</text>

  <rect x="290" y="430" width="200" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="290" y="430" width="200" height="80" rx="6" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
  <text x="390" y="462" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">机器 · BACKGROUND</text>
  <text x="390" y="482" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">单独汇总</text>
  <text x="390" y="498" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">可与其他机器项并行</text>

  <rect x="530" y="430" width="200" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="530" y="430" width="200" height="80" rx="6" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
  <text x="630" y="462" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">机器 · PASSIVE</text>
  <text x="630" y="482" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">单独汇总</text>
  <text x="630" y="498" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">可与其他机器项并行</text>

  <rect x="770" y="430" width="180" height="80" rx="6" fill="#FBF9F6"/>
  <rect x="770" y="430" width="180" height="80" rx="6" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
  <text x="860" y="462" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">等待 · WAITING</text>
  <text x="860" y="482" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">单列一项</text>
  <text x="860" y="498" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">既不算人工也不算机器</text>

  <!-- ===== 输出 ===== -->
  <rect x="310" y="620" width="380" height="88" rx="6" fill="#FBF9F6"/>
  <rect x="310" y="620" width="380" height="88" rx="6" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="500" y="652" fill="#2A2320" font-size="12" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">报表 DTO</text>
  <text x="500" y="674" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">measure · timezone · range · as_of · epoch / revision</text>
  <text x="500" y="692" fill="#6F6357" font-size="8.5" font-family="'Geist Mono',monospace"
        text-anchor="middle">四类测量并列返回，绝不并成一个数</text>

  <!-- ===== 注记 ===== -->
  <text x="40" y="740" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    统计范围统一为半开区间 [from,to)；每段有效 interval 与范围取交集，运行区间的 end 使用同一协调器快照的单调归属终点，不另采墙钟。</text>
  <text x="40" y="760" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    人工只算 FOREGROUND，机器分 BACKGROUND / PASSIVE 两项，WAITING 单列；禁止把并行的机器时长加成人工。</text>
  <text x="40" y="780" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    关联时长：所有关联标签都计全部人工时长，与 weight 是否存在无关；多个标签之和可以大于人工总量，界面必须明示不可相加。</text>
  <text x="40" y="800" fill="#6F6357" font-size="9.5" font-family="'Geist',sans-serif">
    加权只在同一 kind 内分配：weight 为 NULL 表示未分配；总和小于 1 的差额归“未分配”，超过 1 拒绝保存，不偷偷归一化。</text>

  <!-- ===== 图例（底部横条） ===== -->
  <line x1="30" y1="830" x2="970" y2="830" stroke="rgba(42,35,32,0.14)" stroke-width="0.8"/>
  <text x="30" y="850" fill="#6F6357" font-size="8" font-family="'Geist Mono',monospace"
        letter-spacing="0.14em">LEGEND</text>
  <rect x="110" y="841" width="16" height="10" rx="2" fill="#F1F7F6" stroke="#A8CCC8" stroke-width="1"/>
  <text x="132" y="850" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">输入与输出</text>
  <rect x="270" y="841" width="16" height="10" rx="2" fill="#FBE0D5" stroke="#D9603A" stroke-width="1"/>
  <text x="292" y="850" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">焦点：全图唯一的计算规则</text>
  <rect x="500" y="841" width="16" height="10" rx="2" fill="#FBF1DC" stroke="#CBA758" stroke-width="1"/>
  <text x="522" y="850" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">四类并列、互不相加的测量</text>
  <line x1="730" y1="846" x2="760" y2="846" stroke="#6F6357" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="772" y="850" fill="#6F6357" font-size="9" font-family="'Geist',sans-serif">禁止跨越的合并边界</text>
</svg>
