[package]
name = "worktrace"
version = "0.1.0"
description = "Worktrace desktop application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "worktrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# P1: storage + domain foundation.
# `bundled` compiles SQLite in, so no system libsqlite3-dev is required and the
# build stays reproducible on a machine without sudo.
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

# P4：时区与日历（02 §9 的「今日」按用户时区算，不取 updated_at）。
# 必须用**非默认特性**：默认特性会拉 `jiff-static`，本机离线缓存里没有它，
# `cargo test --offline` 会直接失败（已实测）。
# `tzdb-bundle-platform` 把 IANA 库打进产物（Windows 打包不依赖系统 tzdata）；
# `tz-system` 让「今日」能默认取机器时区（本机实测 Asia/Shanghai）。
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
