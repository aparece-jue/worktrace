[package]
name = "worktrace"
version = "0.1.0"
description = "Worktrace desktop application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "worktrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`（P7 Task 4，F-011）：托盘图标与菜单。**离线可行**——它是 `tauri` 的
# 可选依赖，`tray-icon 0.25.1` / `muda` 早就在 `Cargo.lock` 的解析图里，Windows 侧
# cargo 缓存里也有（已实测）。图标取 `app.default_window_icon()`（构建期嵌好的
# `bundle.icon`），所以**不启用** `image-png` / `image-ico`：那要 `image` crate，
# 本机离线缓存与 `Cargo.lock` 里都没有。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# P1: storage + domain foundation.
# `bundled` compiles SQLite in, so no system libsqlite3-dev is required and the
# build stays reproducible on a machine without sudo.
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

# P4：时区与日历（02 §9 的「今日」按用户时区算，不取 updated_at）。
# 必须用**非默认特性**：默认特性会拉 `jiff-static`，本机离线缓存里没有它，
# `cargo test --offline` 会直接失败（已实测）。
# `tzdb-bundle-platform` 把 IANA 库打进产物（Windows 打包不依赖系统 tzdata）；
# `tz-system` 让「今日」能默认取机器时区（本机实测 Asia/Shanghai）。
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }

[target.'cfg(windows)'.dependencies]
# P6 Task 2c：正式 OS 事件源（锁屏/解锁、休眠/唤醒、系统改时）。
#
# **不是新增下载**：`windows-sys 0.61.2` 早就在 `Cargo.lock` 里，而且是本仓 Windows
# 构建**已经在编译**的传递依赖（`tray-icon 0.25.1` / `muda 0.20.0` / `window-vibrancy`），
# 源码也已解包在本机 cargo 缓存里。这里只是把它提升为**直接**依赖，并多启用几个
# feature——feature 是同一份源码的编译期开关，不触发任何下载（`cargo build --offline` 实测）。
# 版本写 `0.61` 让 lock 里那个 `0.61.2` 满足；**不要**跑 `cargo update`。
#
# 逐个 feature 的用途（全部来自 `platform/system_events.rs`）：
# - `Win32_Foundation`：`HWND` / `WPARAM` / `LPARAM` / `LRESULT` / `HINSTANCE` 这些基础别名；
# - `Win32_Graphics_Gdi`：`WNDCLASSW` 的 `hbrBackground` 字段类型 `HBRUSH`（窗口类定义的一部分）；
# - `Win32_System_LibraryLoader`：`GetModuleHandleW`（窗口类与 `UnregisterClassW` 要的实例句柄）；
# - `Win32_System_RemoteDesktop`：`WTSRegisterSessionNotification` / `WTSUnRegisterSessionNotification`
#   （锁屏与解锁，`WM_WTSSESSION_CHANGE`）；
# - `Win32_UI_WindowsAndMessaging`：窗口类与消息循环（`RegisterClassW` / `CreateWindowExW` /
#   `PeekMessageW` / `DispatchMessageW` / `MsgWaitForMultipleObjectsEx` / `DefWindowProcW` /
#   `DestroyWindow` / `UnregisterClassW`）以及三类消息与它们的参数常量
#   （`WM_POWERBROADCAST` + `PBT_APM*`、`WM_WTSSESSION_CHANGE` + `WTS_SESSION_LOCK/UNLOCK`、
#   `WM_TIMECHANGE`）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
